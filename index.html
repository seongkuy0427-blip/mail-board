<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>📧 회사 메일 보드</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --ink-2:#4a5768; --ink-3:#8794a5;
    --line:#e3e8ef; --brand:#1f5fd0; --brand-weak:#eaf1fd;
    --red:#d93b3b; --red-weak:#fdeaea; --orange:#c9711a; --orange-weak:#fdf2e3;
    --green:#1a8a5a; --green-weak:#e8f6ef; --violet:#6b46c1; --violet-weak:#f0ebfa;
    --gray-weak:#eef1f6;
    --shadow:0 1px 2px rgba(16,32,64,.06), 0 8px 24px rgba(16,32,64,.05);
    --r:14px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{background:var(--bg); color:var(--ink); line-height:1.5; -webkit-text-size-adjust:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif}
  body.locked{overflow:hidden}
  a{color:var(--brand); text-decoration:none}
  button{font-family:inherit}
  .wrap{max-width:1120px; margin:0 auto; padding:0 16px}

  /* ---------- 잠금 ---------- */
  #gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px}
  .gate-card{width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:30px 26px 24px; text-align:center}
  .gate-logo{width:52px;height:52px;border-radius:15px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
  .gate-card h1{font-size:19px; margin:0 0 6px; letter-spacing:-.3px}
  .gate-card p{margin:0 0 20px; color:var(--ink-3); font-size:13px}
  .pin-input{width:100%; padding:14px 12px; font-size:22px; letter-spacing:.4em; text-align:center;
    border:1.5px solid var(--line); border-radius:12px; outline:none; background:#fbfcfe; color:var(--ink)}
  .pin-input:focus{border-color:var(--brand); background:#fff}
  .gate-row{display:flex; align-items:center; gap:8px; margin:14px 0 4px; font-size:13px; color:var(--ink-2); text-align:left}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line);
    background:#fff; color:var(--ink); padding:9px 14px; border-radius:10px; font-size:13px; cursor:pointer; white-space:nowrap}
  .btn:hover{background:#f8fafc}
  .btn-primary{background:var(--brand); border-color:var(--brand); color:#fff}
  .btn-primary:hover{background:#1a52b8}
  .btn-block{width:100%; padding:12px; font-size:14px; margin-top:16px}
  .err{color:var(--red); font-size:12.5px; min-height:18px; margin-top:10px}
  .gate-foot{margin-top:16px; font-size:11.5px; color:var(--ink-3); line-height:1.6}

  /* ---------- 헤더 ---------- */
  header{position:sticky; top:0; z-index:30; background:rgba(244,246,250,.94); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
  .hd{display:flex; align-items:center; gap:12px; padding:10px 0}
  .hd .mark{width:32px;height:32px;border-radius:9px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
  .hd h1{font-size:15px; margin:0; letter-spacing:-.2px}
  .hd .sub{font-size:11px; color:var(--ink-3); margin-top:1px}
  .hd-right{margin-left:auto; display:flex; align-items:center; gap:7px}
  .sync{font-size:11px; color:var(--ink-3); text-align:right; line-height:1.3}
  .sync b{color:var(--ink-2); font-weight:600}
  .icon-btn{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
  .icon-btn:hover{background:#f8fafc}
  /* 🔔 옆의 작은 '알림 테스트' 버튼 */
  .notif-test{height:32px; padding:0 10px; border-radius:9px; border:1px solid var(--line); background:#fff; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:4px; font-size:11.5px; font-weight:600;
    color:var(--ink-2); white-space:nowrap; transition:background .12s, transform .06s}
  .notif-test:hover{background:#f8fafc; border-color:#cfd9e8; color:var(--ink)}
  .notif-test:active{transform:scale(.97)}
  .spin{animation:sp .9s linear infinite; display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- 요약 ---------- */
  .kpi{display:grid; grid-template-columns:repeat(5,1fr); gap:9px; margin:14px 0 4px}
  .kpi-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; box-shadow:var(--shadow)}
  .kpi-card .lab{font-size:11px; color:var(--ink-3)}
  .kpi-card .val{font-size:22px; font-weight:700; letter-spacing:-.5px; margin-top:1px; line-height:1.15}
  .kpi-card .val small{font-size:11px; font-weight:500; color:var(--ink-3); margin-left:2px}
  .kpi-card .cap{font-size:10.5px; color:var(--ink-3); margin-top:1px}
  .k1{border-left:3px solid var(--violet); background:linear-gradient(180deg,#fbf9ff,#fff 60%)}
  .k2{border-left:3px solid var(--red)}
  .k3{border-left:3px solid var(--orange)}
  .k4{border-left:3px solid var(--green)}
  .k5{border-left:3px solid var(--orange); background:linear-gradient(180deg,#fffaf2,#fff 60%)}
  @media (max-width:1000px){ .kpi{grid-template-columns:repeat(3,1fr)} }
  /* ⏳ 미회신 추적 탭 */
  .seg button[data-tab="fu"]{color:#93540f}
  .seg button[data-tab="fu"].on{background:var(--orange); border-color:var(--orange); color:#fff}
  .seg button[data-tab="fu"].on .n{background:rgba(255,255,255,.24); color:#fff}
  .row.fu{border-left-color:var(--orange)}
  .row.fu.done{border-left-color:#cbd5e3}
  .row .rank.fu{background:var(--orange-weak); color:#93540f; border-color:#eccfa8; min-width:26px}
  .b-fu{background:var(--orange-weak); color:#93540f; border:1px solid #eccfa8; font-weight:700}
  .b-fu-done{background:var(--green-weak); color:var(--green); border:1px solid #c9e7d5}
  .fu-note{font-size:11px; color:var(--ink-3); margin:0 2px 7px; line-height:1.55}
  .fu-kpi-dot{font-size:10px; color:#93540f}

  /* ---------- 캘린더 ---------- */
  .cal-panel{background:var(--card); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); margin:10px 0 12px; overflow:hidden}
  .cal-bar{display:flex; align-items:center; gap:8px; width:100%; padding:10px 14px; background:#fbfcfe; border:0; cursor:pointer;
    font-family:inherit; font-size:12.5px; font-weight:700; color:var(--ink-2); text-align:left}
  .cal-bar:hover{background:#f5f8fd}
  .cal-bar .chev{color:var(--violet); font-size:11px; transition:transform .15s}
  .cal-bar.open .chev{transform:rotate(90deg)}
  .cal-bar .cb-sum{margin-left:auto; font-weight:500; font-size:11.5px; color:var(--ink-3)}
  .cal-bar .cb-sum b{color:var(--red); font-weight:700}
  .cal-body{border-top:1px solid var(--line)}
  .cal-grid-wrap{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
  .cal-main{padding:12px 14px; border-right:1px solid var(--line); min-width:0}
  .cal-side{padding:12px 14px; min-width:0; background:#fbfcfe}
  .cal-top{display:flex; align-items:center; gap:8px; margin-bottom:8px}
  .cal-title{font-size:13.5px; font-weight:700}
  .cal-title .cap{font-size:10.5px; font-weight:500; color:var(--ink-3); margin-left:6px}
  .cal-nav{margin-left:auto; display:flex; gap:5px; align-items:center}
  .cal-nav button{height:26px;min-width:26px;padding:0 6px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink-2);font-size:11.5px}
  .cal-nav button:hover{background:#f2f5fa}
  .dow{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; margin-bottom:3px}
  .dow div{font-size:10px; color:var(--ink-3); text-align:center; font-weight:600}
  .dow div.sun{color:#dc2626}
  .dow div.sat{color:#2563eb}
  .day.sun .dn{color:#dc2626}
  .day.sat .dn{color:#2563eb}
  .day.hol .dn{color:#dc2626}
  .day .hn{font-size:8.5px; line-height:1.15; color:#dc2626; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .days{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
  .day{min-height:54px; border:1px solid var(--line); border-radius:8px; background:#fff; padding:2px 3px; overflow:hidden; display:flex; flex-direction:column; gap:1px}
  .day.pad{background:transparent; border-color:transparent; min-height:0}
  .day.has{cursor:pointer; background:#fbfaff; border-color:#ded6f4}
  .day[data-day]{cursor:pointer}
  .day[data-day]:hover{background:#f4f0fd}
  .day.has:hover{background:#f4f0fd}
  .day.today{border-color:var(--brand); box-shadow:inset 0 0 0 1px var(--brand)}
  .day.sel{background:var(--violet-weak); border-color:var(--violet); box-shadow:inset 0 0 0 1px var(--violet)}
  .day .dn{font-size:10.5px; color:var(--ink-2); font-weight:600; display:flex; align-items:center; gap:3px}
  .day.today .dn{font-weight:800}
  .day .dn .cnt{margin-left:auto; background:var(--violet); color:#fff; font-size:9px; border-radius:999px; padding:0 5px; font-weight:700}
  .day .ev{font-size:9.5px; line-height:1.25; color:var(--ink-2); background:#f1ecfb; border-radius:3px; padding:0 3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .day .ev.urgent{background:var(--red-weak); color:var(--red)}
  .day .dotrow{display:none}
  .cal-legend{display:flex; gap:10px; margin-top:7px; font-size:10px; color:var(--ink-3); flex-wrap:wrap}
  .cal-legend i{display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:3px; vertical-align:0}
  .side-h{font-size:11.5px; font-weight:700; color:var(--ink-2); display:flex; align-items:center; gap:5px; margin:0 0 6px}
  .side-h .n{font-weight:500; color:var(--ink-3); font-size:10.5px}
  .side-list{display:flex; flex-direction:column; gap:5px; margin-bottom:11px}
  .side-item{background:#fff; border:1px solid var(--line); border-radius:8px; padding:6px 8px; cursor:pointer}
  .side-item:hover{border-color:#c9d6ea; background:#f8fbff}
  .side-item .t{font-size:11.5px; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; display:block}
  .side-item .m{font-size:10px; color:var(--ink-3); margin-top:1px}
  .side-item .m b{color:var(--red); font-weight:600}
  .side-item.urgent{border-left:3px solid var(--red)}
  .side-empty{font-size:11px; color:var(--ink-3); padding:0 0 4px}

  /* ---------- 탭 / 칩 ---------- */
  .seg{display:flex; gap:5px; margin:0 0 8px; flex-wrap:wrap}
  .seg button{display:inline-flex; align-items:center; gap:5px; padding:7px 12px; border-radius:999px; border:1px solid var(--line);
    background:#fff; color:var(--ink-2); font-size:12.5px; cursor:pointer; font-weight:600}
  .seg button .n{font-size:10.5px; font-weight:700; padding:1px 6px; border-radius:999px; background:var(--gray-weak); color:var(--ink-2)}
  .seg button.on{background:var(--ink); border-color:var(--ink); color:#fff}
  .seg button.on .n{background:rgba(255,255,255,.2); color:#fff}
  .seg button[data-tab="p2"].on{background:var(--brand); border-color:var(--brand)}
  .seg button[data-tab="p3"]{color:var(--ink-3)}
  .seg button[data-tab="p3"].on{background:#5d6b7e; border-color:#5d6b7e; color:#fff}
  .chip-row{display:flex; gap:5px; flex-wrap:wrap; align-items:center; margin:0 0 7px}
  .chip{display:inline-flex; align-items:center; gap:4px; padding:5px 10px; border-radius:999px; border:1px solid var(--line);
    background:#fff; color:var(--ink-2); font-size:11.5px; cursor:pointer; font-weight:600}
  .chip:hover{background:#f7f9fc}
  .chip .n{font-size:10px; font-weight:700; padding:0 5px; border-radius:999px; background:var(--gray-weak); color:var(--ink-2)}
  .chip.on{background:var(--violet); border-color:var(--violet); color:#fff}
  .chip.on .n{background:rgba(255,255,255,.22); color:#fff}
  .chip.vip{border-color:#e8cf85; background:#fffdf5; color:#7a5f12}
  .chip.vip.on{background:#b8860b; border-color:#b8860b; color:#fff}
  .chip-sep{width:1px; height:16px; background:var(--line); margin:0 2px}
  .group-toggle{display:inline-flex; align-items:center; gap:5px; margin-left:auto; font-size:11px; color:var(--ink-2); cursor:pointer;
    border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 10px}
  .group-toggle input{accent-color:var(--violet); margin:0}
  .rank-note{font-size:10.5px; color:var(--ink-3); margin:0 2px 8px; line-height:1.5}
  .rank-note b{color:var(--ink-2)}

  .toolbar{margin:0 0 8px; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
  .search{position:relative; flex:1 1 220px; min-width:170px}
  .search input{width:100%; padding:8px 11px 8px 30px; border:1px solid var(--line); border-radius:9px; background:#fff; font-size:12.5px; outline:none}
  .search input:focus{border-color:var(--brand)}
  .search span{position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--ink-3); font-size:11px}
  select.sort{padding:7px 9px; border:1px solid var(--line); border-radius:9px; background:#fff; font-size:12px; color:var(--ink-2)}
  .tog{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; color:var(--ink-2); border:1px solid var(--line);
    background:#fff; border-radius:9px; padding:7px 10px; cursor:pointer; font-weight:600}
  .tog input{accent-color:var(--orange); margin:0}
  .tog.on{background:var(--orange-weak); border-color:#eccfa8; color:#93540f}

  .daychip{display:none; align-items:center; gap:8px; margin:0 0 8px; padding:6px 9px; background:var(--violet-weak);
    border:1px solid #ded6f4; border-radius:9px; font-size:12px; color:#4a3a76}
  .daychip.on{display:inline-flex}
  .daychip button{border:1px solid #cfc4ea; background:#fff; color:#4a3a76; border-radius:7px; font-size:11px; padding:3px 8px; cursor:pointer}

  /* ---------- 컴팩트 행 ---------- */
  .sec-title{display:flex; align-items:center; gap:7px; margin:4px 2px 5px; font-size:11.5px; font-weight:700; color:var(--ink-2)}
  .sec-title .hint{font-weight:500; font-size:10.5px; color:var(--ink-3)}
  .rows{display:flex; flex-direction:column; gap:5px; margin-bottom:8px}
  .row{display:flex; align-items:center; gap:9px; width:100%; text-align:left; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-left:4px solid #b9c2cf; border-radius:10px;
    padding:8px 11px; box-shadow:0 1px 2px rgba(16,32,64,.04)}
  .row:hover{background:#fcfdff; border-color:#cfd9e8}
  .row.p1{border-left-color:var(--violet)}
  .row.p2{border-left-color:var(--brand)}
  .row.p3{border-left-color:#b9c2cf}
  .row.done{opacity:.6}
  .row.hot{background:#fff8f4; border-color:#f0c9ac}
  .row.over{background:#fef5f5; border-color:#efb9b9}
  .row .rank{flex:none; font-size:10px; font-weight:700; color:#5b4b8a; background:var(--violet-weak); border:1px solid #e2daf5;
    border-radius:6px; padding:2px 5px; min-width:24px; text-align:center}
  .row .rank.vip{background:linear-gradient(90deg,#f7e6b0,#fbf3d6); color:#7a5f12; border-color:#e8cf85}
  .row .rank.p2{background:var(--brand-weak); color:var(--brand); border-color:#d3e1fb}
  .row .rank.p3{background:var(--gray-weak); color:var(--ink-3); border-color:#e1e6ee}
  .row .rmain{flex:1 1 auto; min-width:0}
  .row .rt{display:flex; align-items:center; gap:5px; min-width:0}
  .row .rtitle{font-size:13.3px; font-weight:600; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .thr{flex:none; font-size:9.5px; font-weight:700; color:var(--violet); background:var(--violet-weak); border-radius:999px; padding:1px 5px}
  .row .rmeta{font-size:10.5px; color:var(--ink-3); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .row .rmeta b{color:var(--ink-2); font-weight:500}
  .row .rside{flex:none; display:flex; align-items:center; gap:4px}
  .badge{font-size:10px; padding:2px 7px; border-radius:999px; font-weight:600; white-space:nowrap; letter-spacing:-.1px}
  .b-due{background:var(--brand-weak); color:var(--brand)}
  .b-due.hot{background:var(--red); color:#fff}
  .b-due.over{background:#e0533f; color:#fff}
  .b-reply{background:#fff3e2; color:#9a5a09; border:1px solid #f0d6b0}
  .b-replied{background:var(--green-weak); color:var(--green); border:1px solid #c9e7d5}
  .b-noreply{background:var(--gray-weak); color:var(--ink-3); border:1px solid #e1e6ee}
  /* 행 안에서 바로 누르는 회신 상태 토글 */
  .badge.reply-tog{display:inline-flex; align-items:center; gap:3px; font-family:inherit; cursor:pointer;
    padding:2px 6px 2px 7px; line-height:1.35; transition:background .12s, transform .06s}
  .badge.reply-tog:hover{filter:brightness(.96)}
  .badge.reply-tog:active{transform:scale(.96)}
  .badge.reply-tog:focus-visible{outline:2px solid var(--brand); outline-offset:1px}
  .badge.reply-tog .arw{font-size:8px; opacity:.7; line-height:1}
  .b-vip{background:linear-gradient(90deg,#f7e6b0,#fbf3d6); color:#7a5f12; border:1px solid #e8cf85}
  .b-to{background:#e7f4ec; color:#177a4d; border:1px solid #c9e7d5}
  .b-cc{background:var(--gray-weak); color:var(--ink-2); border:1px solid #e1e6ee}
  .b-st{background:#fff; border:1px solid var(--line); color:var(--ink-2)}
  .b-arch{background:#f4f2ec; color:#7d7259; border:1px dashed #d5cdb9}
  /* 행에서 바로 누르는 캘린더 등록 · 확인(완료) 토글 */
  .badge.tog{cursor:pointer; font-family:inherit; line-height:1.35; transition:background .12s, transform .06s}
  .badge.tog:hover{filter:brightness(.96)}
  .badge.tog:active{transform:scale(.96)}
  .badge.tog:focus-visible{outline:2px solid var(--brand); outline-offset:1px}
  .b-cal{background:#fff; border:1px solid #ded6f4; color:#5b4b8a}
  .b-cal.on{background:var(--violet); border-color:var(--violet); color:#fff}
  .b-done{background:#fff; border:1px solid #c9e7d5; color:var(--green)}
  .b-done:hover{background:var(--green-weak)}
  .b-undo{background:var(--green-weak); border:1px solid #bfe6d3; color:var(--green)}
  .cal-date{display:inline-flex; align-items:center; gap:4px; font-size:11px; color:var(--ink-2); background:#fff; border:1px solid var(--line); border-radius:7px; padding:2px 6px}
  .cal-date input{border:0; background:transparent; font:inherit; color:inherit; outline:none; padding:0}
  /* ＋ 직접 일정 추가 (메일과 무관한 개인·구두 일정) */
  .cal-add{padding:9px 14px 8px; background:#fffdf7; border-bottom:1px solid var(--line)}
  .cal-add form{display:flex; gap:6px; align-items:center; flex-wrap:wrap}
  .cal-add .ca-lab{font-size:11.5px; font-weight:700; color:#8a5320}
  .cal-add input[type="date"], .cal-add input[type="text"]{border:1px solid var(--line); border-radius:7px; background:#fff; font:inherit; font-size:11.5px; color:var(--ink-2); padding:5px 7px; outline:none}
  .cal-add input[type="text"]#cusTitle{flex:1 1 200px; min-width:150px}
  .cal-add input[type="text"]#cusMemo{flex:1 1 140px; min-width:110px}
  .cal-add input:focus{border-color:var(--orange)}
  .cal-add .ca-hint{font-size:10px; color:var(--ink-3); margin-top:4px; line-height:1.45}
  .day .ev.cus{background:#fdeee2; color:#8a5320}
  .row.cus{border-left-color:#e0a163}
  .row .rank.cus{background:var(--orange-weak); color:#93540f; border-color:#eccfa8; min-width:26px}
  .b-cus{background:var(--orange-weak); color:#93540f; border:1px solid #eccfa8; font-weight:700}
  .b-del{background:#fff; border:1px solid #efc9c9; color:var(--red); font-weight:700}
  .b-del:hover{background:var(--red-weak)}

  .banner{display:flex; gap:8px; align-items:flex-start; padding:9px 11px; border-radius:10px; background:#f7f9fc;

  /* ---------- 상세 드로어 / 시트 ---------- */

  .dr-meta-top{margin:0 0 7px}
  .dr-summary{font-size:12.8px; color:var(--ink-2); line-height:1.6; margin:0}

  .todo{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px}

  .todo input{margin-top:2px; width:14px; height:14px; accent-color:var(--brand); flex:none; cursor:pointer}
  .todo li.on span{text-decoration:line-through; color:var(--ink-3)}
  .att-list{display:flex; flex-wrap:wrap; gap:5px}

  .thread-list{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px}
  .thread-list li{display:flex; gap:6px; font-size:11.3px; color:var(--ink-2); line-height:1.45; padding:4px 0; border-bottom:1px dashed #eef1f6}
  .thread-list li:last-child{border-bottom:none}
  .thread-list .th-date{flex:none; color:var(--ink-3); font-size:10.3px; min-width:78px}
  .thread-list .th-from{flex:none; color:var(--ink-2); font-weight:600; max-width:92px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .thread-list .th-gist{flex:1; min-width:0; color:var(--ink-3)}
  details.thread>summary{cursor:pointer; font-size:11.5px; color:var(--brand); font-weight:600; list-style:none}
  details.thread>summary::-webkit-details-marker{display:none}
  details.thread>summary::before{content:"▸ "; }
  details.thread[open]>summary::before{content:"▾ " }
  .body-text{font-size:12.2px; color:var(--ink-2); white-space:pre-wrap; background:#f8fafc; border:1px solid var(--line);
    border-radius:8px; padding:9px 10px; line-height:1.6; max-height:240px; overflow:auto}
  /* 본문 표 */
  .dr-table{width:100%; border-collapse:collapse; font-size:11.8px; margin:0 0 8px; background:#fff}
  .dr-table th, .dr-table td{border:1px solid var(--line); padding:5px 7px; text-align:left; color:var(--ink-2); vertical-align:top}
  .dr-table th{background:#f7f9fc; font-weight:700; color:var(--ink); white-space:nowrap}
  .dr-table td.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}

  .dr-table .tnote{font-size:10.5px; color:var(--ink-3); margin:0 0 6px}
  /* 본문 사진 */
  .img-grid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px}
  .img-grid.single{grid-template-columns:1fr}
  .img-cell{position:relative; display:block; width:100%; padding:0; border:1px solid var(--line); border-radius:8px;
    overflow:hidden; background:#f7f9fc; cursor:zoom-in; line-height:0}
  .img-cell img{display:block; width:100%; height:auto; max-height:220px; object-fit:contain; background:#fff}
  .img-grid.single .img-cell img{max-height:320px}
  .img-cell .zoom{position:absolute; right:5px; bottom:5px; font-size:10px; line-height:1; padding:3px 5px; border-radius:5px;
    background:rgba(22,32,46,.72); color:#fff}

  #lightbox{position:fixed; inset:0; z-index:70; background:rgba(10,16,26,.9); display:none; align-items:center; justify-content:center; padding:16px}
  #lightbox.on{display:flex}
  #lightbox img{max-width:100%; max-height:88vh; object-fit:contain; background:#fff; border-radius:6px; box-shadow:0 10px 40px rgba(0,0,0,.5)}
  #lightbox .lb-close{position:absolute; top:12px; right:12px; width:34px; height:34px; border-radius:50%; border:none;
    background:rgba(255,255,255,.18); color:#fff; font-size:16px; cursor:pointer}
  #lightbox .lb-cap{position:absolute; left:0; right:0; bottom:10px; text-align:center; color:#fff; font-size:11.5px; opacity:.8}
  .icon-btn.ring{color:var(--brand); border-color:#c9dbfb; background:#f4f8ff}
  .icon-btn.ring.off{color:var(--ink-3)}
  .reply-row{display:flex; gap:5px; flex-wrap:wrap}
  .reply-btn{font-size:11.3px; padding:6px 9px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink-2); font-weight:600}
  .reply-btn:hover{background:#f7f9fc}
  .reply-btn.on[data-reply="needs_reply"]{background:#fff3e2; border-color:#f0d6b0; color:#9a5a09}

  .draft{border:1px solid var(--line); border-radius:9px; overflow:hidden; background:#fff}
  .draft-h{display:flex; align-items:center; gap:5px; padding:6px 8px; background:#f7f9fc; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .draft-h .to{font-size:10.5px; color:var(--ink-3); flex:1 1 140px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .draft-body{font-size:12.2px; color:var(--ink-2); white-space:pre-wrap; padding:9px 10px; line-height:1.6; max-height:240px; overflow:auto}
  .mini{font-size:11px; padding:4px 8px; border-radius:7px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink-2)}
  .mini:hover{background:#f2f5fa}
  .mini.on{background:var(--green-weak); border-color:#bfe6d3; color:var(--green)}
  .memo{width:100%; min-height:48px; resize:vertical; font-size:12.2px; padding:8px 9px; border:1px solid var(--line); border-radius:8px; font-family:inherit; color:var(--ink-2); background:#fff; outline:none}
  .memo:focus{border-color:var(--brand)}
  .status-sel{padding:6px 8px; border:1px solid var(--line); border-radius:8px; font-size:11.5px; background:#fff; color:var(--ink-2)}
  .dr-foot{display:flex; align-items:center; gap:7px; padding:9px 14px; border-top:1px solid var(--line); background:#fbfcfe; flex-wrap:wrap; flex:none}
  .dr-foot .reply-row{flex:1 1 auto}
  .dr-foot .sp{margin-left:auto; font-size:10.3px; color:var(--ink-3)}

  footer{text-align:center; color:var(--ink-3); font-size:10.5px; padding:14px 0 30px; line-height:1.7}
  .toast{position:fixed; left:50%; bottom:24px; transform:translate(-50%,20px); background:#16202e; color:#fff; font-size:12.5px;
    padding:9px 14px; border-radius:9px; opacity:0; pointer-events:none; transition:.22s; z-index:60; box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.on{opacity:1; transform:translate(-50%,0)}
  /* 화면 상단 알림 카드 — OS 알림(팝업)이 차단되어도 항상 뜨는 알림 */
  #alertBanner{position:fixed; z-index:65; left:50%; top:10px; transform:translate(-50%,-160%);
    width:min(560px, calc(100vw - 20px)); display:flex; align-items:flex-start; gap:10px;
    background:#fff; border:1px solid #f0c8c8; border-left:5px solid var(--red); border-radius:12px;
    box-shadow:0 14px 38px rgba(16,32,64,.24); padding:11px 12px; opacity:0; pointer-events:none;
    transition:transform .24s ease, opacity .2s ease}
  #alertBanner.on{transform:translate(-50%,0); opacity:1; pointer-events:auto}
  #alertBanner .ab-ico{font-size:19px; line-height:1.15; flex:none}
  #alertBanner .ab-body{flex:1; min-width:0}
  #alertBanner .ab-t{font-size:13px; font-weight:800; color:#b3342f; letter-spacing:-.2px; line-height:1.35}
  #alertBanner .ab-m{font-size:11.8px; color:var(--ink-2); margin-top:3px; line-height:1.5; word-break:break-word}
  #alertBanner .ab-acts{display:flex; gap:6px; margin-top:8px; flex-wrap:wrap}
  #alertBanner .ab-btn{font-size:11.5px; font-weight:700; padding:5px 10px; border-radius:7px; cursor:pointer;
    border:1px solid #dbe7fb; background:#f4f8ff; color:var(--brand)}
  #alertBanner .ab-btn.ghost{border-color:var(--line); background:#fff; color:var(--ink-2)}
  #alertBanner .ab-x{flex:none; width:24px; height:24px; border-radius:7px; border:1px solid var(--line);
    background:#fff; color:var(--ink-3); cursor:pointer; font-size:11.5px; line-height:1; padding:0}
  @media (max-width:860px){ #alertBanner{top:6px; padding:10px 11px} #alertBanner .ab-t{font-size:12.4px} }

  @media (max-width:860px){
    .cal-grid-wrap{grid-template-columns:1fr}
    .cal-main{border-right:none; border-bottom:1px solid var(--line)}
    .day{min-height:42px}
    .day .ev{display:none}
    .day .dotrow{display:flex; gap:2px; flex-wrap:wrap; justify-content:flex-end}
    .day .dotrow i{width:4px;height:4px;border-radius:999px;background:var(--violet); display:inline-block}
    .day .dotrow i.urgent{background:var(--red)}
    .day .dn .cnt{margin-left:0; margin-right:auto}
    #drawer{left:0; right:0; top:auto; bottom:0; height:min(86vh,760px); width:auto;
      border-left:none; border-top:1px solid var(--line); border-radius:16px 16px 0 0;
      transform:translateY(102%); box-shadow:0 -12px 34px rgba(16,32,64,.18)}
    #drawer.on{transform:translateY(0)}
    #drawer::before{content:""; display:block; width:38px; height:4px; border-radius:999px; background:#dfe4ec; margin:7px auto 0}
  }
  @media (max-width:760px){
    .kpi{grid-template-columns:repeat(2,1fr); gap:7px}
    .kpi-card{padding:8px 10px}
    .kpi-card .val{font-size:19px}
    .hd h1{font-size:13.5px}
    .hd .sub{display:none}
    .sync{display:none}
    .row{padding:7px 9px; gap:7px}
    .row .rtitle{font-size:12.6px}
    .row .rmeta{font-size:10px}
    .row .rside{gap:3px}
    .badge{font-size:9.3px; padding:1.5px 5px}
    .badge.reply-tog{padding:3px 6px 3px 7px; gap:2px}
    .seg button{padding:6px 10px; font-size:11.8px}
    .notif-test{padding:0 8px; font-size:10.5px; gap:3px}
    .dr-sec{padding:9px 12px}
  }
</style>
</head>
<body>

<!-- ============ 잠금 화면 ============ -->
<div id="gate">
  <form class="gate-card" id="gateForm" autocomplete="off">
    <div class="gate-logo">📋</div>
    <h1>업무 대시보드</h1>
    <p>천일정기화물 납입1팀 · 김성규 과장</p>
    <input class="pin-input" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="••••" aria-label="PIN">
    <label class="gate-row"><input type="checkbox" id="remember"> 이 기기에서 로그인 유지</label>
    <button class="btn btn-primary btn-block" type="submit" id="unlockBtn">열기</button>
    <div class="err" id="gateErr"></div>
    <div class="gate-foot">데이터는 PIN으로 암호화되어 있습니다.<br>PIN을 모르면 내용을 볼 수 없습니다.</div>
  </form>
</div>

<!-- ============ 대시보드 ============ -->
<div id="app" hidden>
  <header>
    <div class="wrap hd">
      <div class="mark">📋</div>
      <div>
        <h1>업무 대시보드</h1>
        <div class="sub" id="who">천일정기화물 납입1팀</div>
      </div>
      <div class="hd-right">
        <div class="sync" id="sync">마지막 동기화<br><b>-</b></div>
        <button class="icon-btn" id="bellBtn" title="새 메일 알림 켜기" aria-label="새 메일 알림">🔔</button>
        <button class="notif-test" id="notifTestBtn" title="브라우저 알림 팝업이 뜨는지 바로 테스트" aria-label="알림 테스트">🔔 알림 테스트</button>
        <button class="icon-btn" id="refreshBtn" title="새로고침" aria-label="새로고침">↻</button>
        <button class="icon-btn" id="lockBtn" title="잠금" aria-label="잠금">🔒</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="kpi" id="kpi"></div>

    <section class="cal-panel" aria-label="즉시 확인 마감 캘린더">
      <button class="cal-bar" id="calBar" aria-expanded="false" aria-controls="calBody">
        <span class="chev">▸</span><span>📅 내 캘린더</span>
        <span class="cb-sum" id="calSummary"></span>
      </button>
      <div class="cal-body" id="calBody" hidden>
      <div class="cal-add">
        <form id="cusForm" autocomplete="off">
          <span class="ca-lab">＋ 직접 일정 추가</span>
          <input type="date" id="cusDate" aria-label="일정 날짜">
          <input type="text" id="cusTitle" placeholder="일정 제목 (예: 팀 회의 15시 · 거래처 방문)" maxlength="80" aria-label="일정 제목">
          <input type="text" id="cusMemo" placeholder="메모 (선택)" maxlength="120" aria-label="메모">
          <button type="submit" class="mini on" id="cusAddBtn">추가</button>
        </form>
        <div class="ca-hint">메일과 상관없는 개인·구두 일정을 직접 넣습니다. 이 기기에만 저장(`mb_cal_custom_v1`).</div>
      </div>
      <div class="cal-grid-wrap">
        <div class="cal-main">
          <div class="cal-top">
            <div class="cal-title" id="calTitle">2026년 11월<span class="cap">내가 등록한 메일</span></div>
            <div class="cal-nav">
              <button id="calToday">오늘</button>
              <button id="calPrev" aria-label="이전 달">‹</button>
              <button id="calNext" aria-label="다음 달">›</button>
            </div>
          </div>
          <div class="dow" id="calDow"></div>
          <div class="days" id="calDays"></div>
          <div class="cal-legend">
            <span><i style="background:#6b46c1"></i>내가 등록한 메일</span>
            <span><i style="background:#d93b3b"></i>긴급</span>
            <span><i style="background:#1f5fd0"></i>오늘</span>
            <span>행의 📅 캘린더로 직접 등록 · 날짜를 누르면 그날 등록 메일만</span>
          </div>
        </div>
        <div class="cal-side">
          <div class="side-h">오늘 등록 <span class="n" id="sideTodayN"></span></div>
          <div class="side-list" id="sideToday"></div>
          <div class="side-h">이번 주 등록 <span class="n" id="sideWeekN"></span></div>
          <div class="side-list" id="sideWeek"></div>
        </div>
      </div>
      </div>
    </section>

    <div class="seg" id="seg"></div>
    <div class="chip-row" id="chipRow"></div>
    <div class="rank-note" id="rankNote"></div>

    <div class="toolbar">
      <label class="tog" id="doneTog"><input type="checkbox" id="doneChk"> 완료 포함</label>
      <label class="tog" id="replyTog"><input type="checkbox" id="replyChk"> 회신 필요만 보기</label>
      <div class="search"><span>🔍</span><input id="q" type="search" placeholder="제목 · 발신자 · 품번 · 내용 검색 (단순 공유 · 이전 기록도 검색)"></div>
      <select class="sort" id="sort">
        <option value="urgency">긴급도 · 마감순</option>
        <option value="deadline">마감 임박순</option>
        <option value="recent">최신 수신순</option>
      </select>
    </div>

    <div class="daychip" id="dayChip">
      <span id="dayChipText"></span>
      <button id="dayClear">전체 보기 ✕</button>
    </div>

    <div id="listWrap"></div>
    <footer id="foot"></footer>
  </div>
</div>

<div id="backdrop"></div>
<aside id="drawer" aria-hidden="true" aria-label="메일 상세">
  <div id="drawerContent"></div>
</aside>
<div class="toast" id="toast"></div>
<!-- 화면 상단 알림 카드(OS 팝업이 막혀도 항상 뜼) -->
<div id="alertBanner" role="alert" aria-live="assertive" aria-hidden="true">
  <div class="ab-ico">🔴</div>
  <div class="ab-body">
    <div class="ab-t" id="abTitle"></div>
    <div class="ab-m" id="abMsg"></div>
    <div class="ab-acts">
      <button type="button" class="ab-btn" id="abShow">메일 보기</button>
      <button type="button" class="ab-btn ghost" id="abOk">확인</button>
    </div>
  </div>
  <button type="button" class="ab-x" id="abClose" aria-label="알림 닫기">✕</button>
</div>
<div id="lightbox" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button class="lb-close" id="lbClose" aria-label="닫기">✕</button>
  <img id="lbImg" alt="">
  <div class="lb-cap" id="lbCap"></div>
</div>

<script>
(() => {
  "use strict";

  const LS = { pin: "mb_pin_v1", state: "mb_state_v1", cal: "mb_calopen_v1", bell: "mb_bell_v1", seen: "mb_seen_p1_v1", cal2: "mb_cal_items_v1", cus: "mb_cal_custom_v1" };
  const AUTO_REFRESH_MS = 5 * 60 * 1000;

    const key = await deriveKey(pin, b64ToBytes(enc.salt), enc.iterations || 100000);
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(enc.iv) }, key, b64ToBytes(enc.ciphertext));

  function ymd(d) { const p = (n) => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }

    itemState(id).reply = k; saveState();
    const it = byId(id);
    renderKpi(); renderList();
    if (it && view.openId === id) $("drawerContent").innerHTML = drawerHtml(it);
    toast(prev && prev !== k ? REPLY_LABEL[prev] + " → " + REPLY_LABEL[k] : "회신 여부: " + REPLY_LABEL[k]);
  }
  /* ✅ 확인 — 완료로 바꾸면 기본 목록에서 즉시 치운다 (KPI '완료'에 반영, 검색하거나 '완료 포함'을 켜면 다시 보임) */
  function setDone(id, done) {
    const it = byId(id); if (!it) return;
    itemState(id).status = done ? "done" : "todo"; saveState();
    renderKpi(); renderSeg(); renderCalendar(); renderList();
    if (view.openId === id) $("drawerContent").innerHTML = drawerHtml(it);
    toast(done ? "✅ 확인 — 기본 목록에서 치었습니다 (검색·‘완료 포함’에서 다시 볼 수 있음)" : "↩ 완료를 취소해 목록으로 돌렸습니다");
  }
  function threadOf(it) { return it.thread && it.thread.length ? it.thread : [{ date: it.receivedAt, from: it.sender, gist: it.title, link: it.mailLink }]; }

  function human(ms) {
    const m = Math.max(0, Math.round(ms / 60000));
    if (m >= 1440) { const d = Math.floor(m / 1440), hh = Math.floor((m % 1440) / 60); return d + "일" + (hh ? " " + hh + "시간" : ""); }
    if (m < 60) return m + "분";
    const h = Math.floor(m / 60), mm = m % 60;
    return h + "시간" + (mm ? " " + mm + "분" : "");
  }

  /* 마감 배지: 2시간 이내/지난 건은 강조 */
  function dueInfo(it) {
    const due = dueOf(it);
    const ms = deadlineMs(it);
    const now = Date.now();
    const timeStr = it.deadline && /(\d{1,2}:\d{2})/.exec(it.deadline) ? RegExp.$1 : null;
    if (ms !== null) {
      const left = ms - now;
      if (left <= 0) {
        return { cls: "over", text: "⏰ 마감 지남 " + human(-left), hot: true, past: true };
      }
      if (left <= 2 * 3600 * 1000) {
        return { cls: "hot", text: "⏰ " + human(left) + " 남음", hot: true, past: false };
      }
    }
    if (!due) return { cls: "", text: null, hot: false, past: false };
    const dd = diffDays(due, todayY());
    const md = due.slice(5).replace("-", "/");
    let label;
    if (dd === 0) label = "오늘" + (timeStr ? " " + timeStr : "");
    else if (dd === 1) label = "내일" + (timeStr ? " " + timeStr : "");
    else if (dd > 1) label = "D-" + dd + " · " + md;
    else label = "D+" + Math.abs(dd) + " · " + md;
    return { cls: dd < 0 ? "over" : "", text: "⏰ " + label, hot: dd < 0, past: dd < 0 };
  }

  function searchBlob(it) {
    if (it._blob) return it._blob;
    const parts = [it.title, it.sender, it.senderEmail, it.category, it.summary, it.bodyText, it.deadline,
      it.priorityReason, it.dueDate, it.attachmentSummary, (it.actionItems || []).join(" ")];
    (it.attachments || []).forEach((a) => parts.push(a.name));
    (it.thread || []).forEach((m) => parts.push(m.gist + " " + m.from));
    if (it.replyDraft) parts.push(it.replyDraft.subject + " " + it.replyDraft.body);
    it._blob = parts.join(" ").toLowerCase();
    return it._blob;
  }

  function rank(it) { return priorityOf(it) === 1 ? (Number(it.vipRank) || 3) : 9; }
  function sortList(list) {
    list.sort((a, b) => {
      const ra = rank(a), rb = rank(b);
      if (ra !== rb) return ra - rb;
      if (view.sort === "recent") return (b.receivedAt || "").localeCompare(a.receivedAt || "");
      if (view.sort === "deadline") {
        const da = dueOf(a) || "9999-99-99", db = dueOf(b) || "9999-99-99";
        return da.localeCompare(db);
      }
      const u = (URG[a.urgency] ?? 9) - (URG[b.urgency] ?? 9);
      if (u !== 0) return u;
      return (dueOf(a) || "9999-99-99").localeCompare(dueOf(b) || "9999-99-99");
    });
    return list;
  }
  function senderKey(it) { return it.senderName || it.sender || "기타"; }
  function senderLabel(it) { return it.vipLabel || senderKey(it); }
  function senderGroups(list) {
    const map = new Map();
    list.forEach((it) => {
      const k = senderKey(it);
      if (!map.has(k)) map.set(k, { key: k, label: senderLabel(it), vipRank: 99, items: [] });
      const g = map.get(k); g.items.push(it);
      const r = rank(it); if (r < g.vipRank) g.vipRank = r;
      if (it.vipLabel) g.label = it.vipLabel;
    });
    return Array.from(map.values()).sort((a, b) => a.vipRank - b.vipRank || b.items.length - a.items.length || a.label.localeCompare(b.label));
  }
  function matches(it) { const q = view.q.trim().toLowerCase(); return q ? searchBlob(it).includes(q) : true; }

  /* ---------------- 렌더: 요약 ---------------- */
  function renderKpi() {
    const p1 = p1Items();
    const todayDue = p1.filter((i) => { const d = dueInfo(i); return (isTodayDue(i) || d.hot) && !isDone(i); }).length;
    const need = p1.filter((i) => replyOf(i) === "needs_reply" && !isDone(i)).length;
    const doneAll = liveItems().filter(isDone);
    const done = doneAll.length;
    const fu = fuPending();
    const fuMax = fu.length ? Math.max.apply(null, fu.map((f) => Number(f.daysElapsed) || 0)) : 0;
    $("kpi").innerHTML =
      '<div class="kpi-card k1"><div class="lab">🔴 즉시 확인</div><div class="val">' + p1.length + '<small>건</small></div><div class="cap">VIP 발신 · 본문 지목</div></div>' +
      '<div class="kpi-card k2"><div class="lab">오늘·임박 마감</div><div class="val">' + todayDue + '<small>건</small></div><div class="cap">2시간 이내 또는 지남</div></div>' +
      '<div class="kpi-card k3"><div class="lab">회신 필요</div><div class="val">' + need + '<small>건</small></div><div class="cap">즉시 확인 기준</div></div>' +
      '<div class="kpi-card k5"><div class="lab">⏳ 미회신 대기</div><div class="val">' + fu.length + '<small>건</small></div><div class="cap">' + (fuMax ? "최장 " + fuMax + "일째 · 보낸 요청" : "보낸 요청 회신 대기") + '</div></div>' +
      '<div class="kpi-card k4"><div class="lab">완료</div><div class="val">' + done + '<small>건</small></div><div class="cap">' +
        (done ? "🔴 " + doneAll.filter((i) => priorityOf(i) === 1).length + " · 🟡 " + doneAll.filter((i) => priorityOf(i) === 2).length + " · ⚪ " + doneAll.filter((i) => priorityOf(i) === 3).length : "✅ 확인을 누르면 여기로") +
        '</div></div>';
  }

  /* ---------------- 렌더: 내 캘린더 (사용자가 직접 등록) ----------------
     기존의 ‘dueDate 가 있으면 자동으로 채우기’를 없앴다. 캘린더는 오직 행·드로어의
     📅 캘린더 버튼으로 직접 등록한 메일만 보여준다 (localStorage mb_cal_items_v1). */
  function shortTitle(it) { const t = (it.title || "").replace(/\s*\(.*?\)\s*/g, " ").trim(); return t.length > 12 ? t.slice(0, 12) + "\u2026" : t; }
  function sideItem(it) { return sideItemDated(it, calDate(it)); }
  function sideItemDated(it, date) {
    const d = dueInfo(it);
    return '<div class="side-item' + (it.urgency === "urgent" || d.hot ? " urgent" : "") + '" data-open="' + esc(it.id) + '">' +
      '<span class="t">' + esc(it.title) + "</span>" +
      '<div class="m">' + (date ? "📅 <b>" + esc(date) + "</b>" : "") + (d.text ? " · " + esc(d.text.replace("⏰ ", "")) : "") + "</div></div>";
  }

  let CAL = null;
  function calLoad() {
    if (CAL) return CAL;
    CAL = {};
    try { const raw = JSON.parse(localStorage.getItem(LS.cal2) || "{}"); if (raw && typeof raw === "object" && !Array.isArray(raw)) CAL = raw; } catch (e) { CAL = {}; }
    return CAL;
  }
  function calSave() { try { localStorage.setItem(LS.cal2, JSON.stringify(calLoad())); } catch (e) {} }
  const calDate = (it) => calLoad()[it.id] || null;
  const calItems = () => items().filter((it) => !!calDate(it));
  const calCount = () => calItems().length;
  function calDefaultDate(it) { return dueOf(it) || todayY(); }
  /* 행·드로어의 📅 캘린더 — 누르면 등록(기본 마감일 또는 오늘), 다시 누르면 해제 */
  function calToggle(id, date) {
    const it = byId(id); if (!it) return;
    const m = calLoad();
    if (m[id]) {
      delete m[id]; calSave();
      toast("캘린더에서 뺐습니다 — " + shortTitle(it));
    } else {
      m[id] = date || calDefaultDate(it); calSave();
      toast("📅 캘린더에 등록 — " + m[id] + " · " + shortTitle(it));
    }
    renderCalendar(); renderList();
    if (view.openId === id) $("drawerContent").innerHTML = drawerHtml(it);
  }
  function calSetDate(id, date) {
    if (!date) return;
    const it = byId(id); if (!it) return;
    const m = calLoad(); m[id] = date; calSave();
    renderCalendar(); renderList();
    if (view.openId === id) $("drawerContent").innerHTML = drawerHtml(it);
    toast("📅 등록 날짜를 " + date + "(으)로 바꿨습니다");
  }

  /* ---------------- 📌 직접 일정 (메일과 무관한 개인·구두 일정) ----------------
     localStorage mb_cal_custom_v1 에 [{id,date,title,memo,createdAt}] 로 저장한다. */
  let CUS = null;
  function cusLoad() {
    if (CUS) return CUS;
    try { const raw = JSON.parse(localStorage.getItem(LS.cus) || "[]"); CUS = Array.isArray(raw) ? raw.filter((c) => c && c.date && c.title) : []; } catch (e) { CUS = []; }
    return CUS;
  }
  function cusSave() { try { localStorage.setItem(LS.cus, JSON.stringify(cusLoad())); } catch (e) {} }
  const cusCount = () => cusLoad().length;
  const cusFor = (date) => cusLoad().filter((c) => c.date === date).sort((a, b) => String(a.createdAt || "").localeCompare(String(b.createdAt || "")));
  function cusAdd(date, title, memo) {
    const t = String(title || "").trim(), d = String(date || "").trim();
    if (!d) { toast("날짜를 골라 주세요"); return false; }
    if (!t) { toast("일정 제목을 입력해 주세요"); return false; }
    const list = cusLoad();
    list.push({ id: "c-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: d, title: t.slice(0, 80), memo: String(memo || "").trim().slice(0, 120), createdAt: new Date().toISOString() });
    cusSave();
    renderCalendar(); renderList();
    toast("📌 일정을 넣었습니다 — " + d + " · " + t.slice(0, 24));
    return true;
  }
  function cusDel(id) {
    const list = cusLoad(), i = list.findIndex((c) => c.id === id);
    if (i < 0) return;
    const c = list.splice(i, 1)[0];
    cusSave();
    renderCalendar(); renderList();
    toast("일정을 지웠습니다 — " + (c.title || ""));
  }
  function cusRow(c) {
    return '<div class="row cus"><span class="rank cus">📌</span>' +
      '<span class="rmain"><span class="rt"><span class="rtitle">' + esc(c.title) + '</span><span class="badge b-cus">📌 개인/구두</span></span>' +
        '<span class="rmeta">' + esc(c.date) + (c.memo ? " · " + esc(c.memo) : "") + "</span></span>" +
      '<span class="rside"><button type="button" class="badge tog b-del" data-cus-del="' + esc(c.id) + '" title="일정 삭제" aria-label="일정 삭제">✕</button></span></div>';
  }

  function renderCalendar() {
    if (!view.ym) { const n = new Date(); view.ym = { y: n.getFullYear(), m: n.getMonth() }; }
    const y = view.ym.y, m = view.ym.m;
    $("calTitle").innerHTML = y + "년 " + (m + 1) + '월<span class="cap">내가 등록한 메일</span>';
    $("calDow").innerHTML = DOW.map((d, i) => '<div class="' + (i === 0 ? "sun" : (i === 6 ? "sat" : "")) + '">' + d + "</div>").join("");
    const byDate = {}, cusByDate = {};
    calItems().forEach((it) => { const d = calDate(it); if (!d) return; (byDate[d] = byDate[d] || []).push(it); });
    cusLoad().forEach((c) => { (cusByDate[c.date] = cusByDate[c.date] || []).push(c); });
    /* 요일 헤더가 일~토 순서이므로 시작 칸도 일요일(0) 기준으로 채운다.
       (예전엔 (getDay()+6)%7 로 월요일 기준 칸을 채워 요일과 날짜가 한 칸씩 밀렸음) */
    const first = new Date(y, m, 1), startPad = first.getDay(), lastDay = new Date(y, m + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startPad; i++) cells.push('<div class="day pad"></div>');
    for (let d = 1; d <= lastDay; d++) {
      const key = ymd(new Date(y, m, d)), list = byDate[key] || [], cus = cusByDate[key] || [];
      const total = list.length + cus.length;
      const wd = new Date(y, m, d).getDay(), hol = HOLIDAYS[key] || "";
      const isToday = key === todayY(), isSel = view.day === key;
      let inner = '<div class="dn">' + d + (total ? '<span class="cnt">' + total + "</span>" : "") + "</div>";
      if (hol) inner += '<span class="hn">' + esc(hol) + "</span>";
      if (total) {
        if (cus.length) inner += '<span class="ev cus">📌 ' + esc(shortTitle({ title: cus[0].title })) + "</span>";
        else inner += list.slice(0, 1).map((it) => '<span class="ev' + (it.urgency === "urgent" ? " urgent" : "") + '">' + esc(shortTitle(it)) + "</span>").join("");
        if (total > 1) inner += '<span class="ev">+' + (total - 1) + "건</span>";
        inner += '<div class="dotrow">' + cus.slice(0, 2).map(() => '<i class="urgent"></i>').join("") +
          list.slice(0, 4).map((it) => '<i class="' + (it.urgency === "urgent" ? "urgent" : "") + '"></i>').join("") + "</div>";
      }
      cells.push('<div class="day' + (total ? " has" : "") + (wd === 0 ? " sun" : (wd === 6 ? " sat" : "")) + (hol ? " hol" : "") +
        (isToday ? " today" : "") + (isSel ? " sel" : "") + '" data-day="' + key + '" role="button" tabindex="0">' + inner + "</div>");
    }
    $("calDays").innerHTML = cells.join("");

    const today = todayY(), wr = weekRange(new Date()), wStart = ymd(wr.start), wEnd = ymd(wr.end);
    const todayList = calItems().filter((i) => calDate(i) === today);
    const weekList = calItems().filter((i) => { const d = calDate(i); return d && d > today && d >= wStart && d <= wEnd; })
      .sort((a, b) => (calDate(a) || "").localeCompare(calDate(b) || ""));
    const todayCus = cusFor(today), weekCus = cusLoad().filter((c) => c.date > today && c.date >= wStart && c.date <= wEnd)
      .sort((a, b) => String(a.date).localeCompare(String(b.date)));
    $("sideTodayN").textContent = (todayList.length + todayCus.length) ? (todayList.length + todayCus.length) + "건" : "";
    $("sideWeekN").textContent = (weekList.length + weekCus.length) ? (weekList.length + weekCus.length) + "건" : "";
    $("sideToday").innerHTML = (todayList.length + todayCus.length)
      ? todayCus.map(cusSideItem).join("") + todayList.map((it) => sideItemDated(it, calDate(it))).join("")
      : '<div class="side-empty">오늘 등록한 일정이 없습니다. 행의 📅 캘린더나 ＋ 직접 일정 추가를 쓰세요.</div>';
    $("sideWeek").innerHTML = (weekList.length + weekCus.length)
      ? weekCus.map(cusSideItem).join("") + weekList.map((it) => sideItemDated(it, calDate(it))).join("")
      : '<div class="side-empty">이번 주에 등록한 일정이 없습니다.</div>';
    renderCalState(todayList.length + todayCus.length, weekList.length + weekCus.length);
  }

  function cusSideItem(c) {
    return '<div class="side-item urgent"><span class="t">📌 ' + esc(c.title) + '</span><div class="m">📅 <b>' + esc(c.date) + "</b>" + (c.memo ? " · " + esc(c.memo) : "") + "</div></div>";
  }

  function renderCalState(nToday, nWeek) {
    const bar = $("calBar"), body = $("calBody");
    bar.classList.toggle("open", view.calOpen);
    bar.setAttribute("aria-expanded", view.calOpen ? "true" : "false");
    body.hidden = !view.calOpen;
    $("calSummary").innerHTML = "· 등록 <b>" + (calCount() + cusCount()) + "건</b>" +
      (view.calOpen ? " · 오늘 <b>" + nToday + "건</b> · 이번 주 <b>" + nWeek + "건</b>" : " · 눌러서 펼치기");
  }

  /* ---------------- 렌더: 탭 · 칩 ---------------- */
  function renderSeg() {
    const tabs = [["p1", "🔴 즉시 확인", p1Items().length], ["p2", "🟡 흐름 참고", p2Items().length], ["p3", "⚪ 단순 공유", p3Items().length], ["fu", "⏳ 미회신 추적", fuPending().length]];
    $("seg").innerHTML = tabs.map(([k, label, n]) =>
      '<button data-tab="' + k + '" class="' + (view.tab === k ? "on" : "") + '">' + label + '<span class="n">' + n + "</span></button>").join("");
    /* ⏳ 미회신 추적 탭에서는 회신 필터·정렬이 의미 없으므로 숨긴다 */
    const isFu = view.tab === "fu";
    $("replyTog").style.display = isFu ? "none" : "";
    $("sort").style.display = isFu ? "none" : "";
    renderChips();
  }
  function renderChips() {
    const row = $("chipRow"), note = $("rankNote");
    if (view.tab === "p1" || view.tab === "p2") {
      const base = view.tab === "p1" ? p1Items() : p2Items();
      const groups = senderGroups(base);
      let html = '<button class="chip ' + (view.sender === "all" ? "on" : "") + '" data-sender="all">' +
        (view.tab === "p1" ? "전체 즉시 확인" : "전체 흐름 참고") + '<span class="n">' + base.length + "</span></button>";
      html += groups.map((g) => '<button class="chip ' + (g.vipRank === 1 ? "vip " : "") + (view.sender === g.key ? "on" : "") +
        '" data-sender="' + esc(g.key) + '">' + esc(g.label) + '<span class="n">' + g.items.length + "</span></button>").join("");
      html += '<span class="chip-sep"></span><label class="group-toggle"><input type="checkbox" id="groupChk"' + (view.group ? " checked" : "") + "> 사람별로 묶어보기</label>";
      row.style.display = ""; row.innerHTML = html;
    } else { row.style.display = "none"; row.innerHTML = ""; }

    if (view.tab === "p1") {
      const v1 = p1Items().filter((i) => (Number(i.vipRank) || 3) === 1).length;
      const v2 = p1Items().filter((i) => (Number(i.vipRank) || 3) === 2).length;
      note.style.display = "";
      note.innerHTML = "정렬 <b>1-1</b> 최우선 발신(" + v1 + "건) → <b>1-2</b> 주요 발신 · 내가 수신 " + v2 + "건 → " +
        "<b>1-3</b> 본문 지목, 그 안에서 긴급도·마감순";
    } else if (view.tab === "fu") {
      note.style.display = "";
      note.innerHTML = "보낸편지함(10/30~11/19)에서 <b>상대에게 회신이 필요한 요청</b>을 보낸 건을 받은편지함과 대조한 결과입니다. (업무 완료 보고·자료 제출은 제외) " +
        "회신이 확인된 건 <b>추적 완료</b>로 바꾸면 대기 건수에서 바로 빠집니다.";
    } else { note.style.display = "none"; note.innerHTML = ""; }
  }

  /* ---------------- 렌더: 목록 ---------------- */
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

  function rowHtml(it) {
    const p = priorityOf(it), d = dueInfo(it), r = replyOf(it), st = stateOf(it);
    const thr = threadOf(it).length;
    const cls = "row p" + p + (p === 1 && d.hot && !isDone(it) ? (d.past ? " over" : " hot") : "") + (st.status === "done" ? " done" : "");
    const rankTxt = p === 1 ? "1-" + (Number(it.vipRank) || 3) : (p === 2 ? "🟡" : "⚪");
    const rankCls = "rank p" + p + (it.isVip && Number(it.vipRank) === 1 ? " vip" : "");
    const replyCls = r === "needs_reply" ? "b-reply" : (r === "replied" ? "b-replied" : "b-noreply");
    const replyTitle = "클릭하면 회신 상태가 바뀝니다 (" + REPLY_LABEL[r] + " → " + REPLY_LABEL[NEXT_REPLY[r]] + ")" +
      (it.repliedNote && !stateOf(it).reply ? " · " + it.repliedNote : "");
    return '<div class="' + cls + '" data-open="' + esc(it.id) + '" role="button" tabindex="0">' +

          '" aria-label="캘린더 등록 토글">📅 ' + (calDate(it) ? esc(String(calDate(it)).slice(5).replace("-", "/")) : "캘린더") + "</button>" +
        '<button type="button" class="badge tog ' + (isDone(it) ? "b-undo" : "b-done") + '" data-done-tog="' + esc(it.id) + '" title="' +
          esc(isDone(it) ? "완료 취소 — 기본 목록으로 다시 돌림" : "✅ 확인 — 기본 목록에서 바로 치우기 (KPI 완료에 반영)") +

  function rowsBlock(list) {
    if (!list.length) return "";
    if (!view.group) return '<div class="rows">' + list.map(rowHtml).join("") + "</div>";
    return senderGroups(list).map((g, gi) =>
      '<div class="group-h' + (gi === 0 ? " first" : "") + '">' + esc(g.label) + '<span class="n">' + g.items.length + "건</span></div>" +
      '<div class="rows">' + sortList(g.items.slice()).map(rowHtml).join("") + "</div>").join("");
  }

  function currentList() {

    let list = view.day ? items().filter((it) => calDate(it) === view.day) : base;
    list = list.filter(matches);
    if (!view.day && (view.tab === "p1" || view.tab === "p2") && view.sender !== "all") list = list.filter((it) => senderKey(it) === view.sender);

    if (!view.showDone && !view.q.trim()) list = list.filter((it) => !isDone(it));
    return sortList(list);
  }

      html += main.length ? rowsBlock(main) : '<div class="empty">' + (view.day ? "이 날짜에 마감인 즉시 확인 건이 없습니다." : (view.replyOnly ? "회신이 필요한 즉시 확인 건이 없습니다." : (q && history.length ? "오늘(11/19 이후) 즉시 확인에는 없습니다. 아래 ‘이전 기록’에서 " + history.length + "건 찾았습니다." : "지금은 본문에서 회원님을 직접 지목한 메일이 없습니다.<br>고객사·사내 이슈는 <b>🟡 흐름 참고</b> 탭에서 볼 수 있습니다."))) + "</div>";
    } else if (view.tab === "p2") {

      html += main.length ? rowsBlock(main) : '<div class="empty">조건에 맞는 흐름 참고 건이 없습니다.</div>';
    } else {

      html += main.length ? rowsBlock(main) : '<div class="empty">조건에 맞는 단순 공유 건이 없습니다.</div>';

        '<div class="banner" style="margin-bottom:5px">ℹ️ <div>기본 화면에서는 빠져 있는 지난 메일입니다. 검색어를 지우면 다시 숨겨집니다.</div></div>' + rowsBlock(history);

  /* ---------------- 렌더: ⏳ 미회신 추적 ---------------- */
  function fuBlob(f) {
    const d = f.followUpDraft || {};
    return [f.title, f.recipient, f.recipientEmail, f.requestType, f.summary, f.bodyText, f.evidence, d.subject, d.body]
      .join(" ").toLowerCase();
  }
  function fuRowHtml(f) {
    const done = fuDone(f);
    return '<div class="row fu' + (done ? " done" : "") + '" data-open="' + esc(f.id) + '" role="button" tabindex="0" aria-label="' + esc(f.title) + '">' +
      '<span class="rank fu">' + (done ? "✅" : "⏳") + "</span>" +
      '<span class="rmain"><span class="rt"><span class="rtitle">' + esc(f.title) + "</span></span>" +
        '<span class="rmeta"><b>' + esc(f.recipient) + "</b> · " + esc(f.sentAt) + " · " + esc(f.requestType || "요청") +
        (f.attachName ? " · 📎 " + esc(f.attachName) : "") + "</span></span>" +
      '<span class="rside">' +
        (done ? '<span class="badge b-fu-done">✅ 추적 완료</span>'
              : '<span class="badge b-fu">⏳ 미회신 ' + esc(String(f.daysElapsed)) + "일째</span>") +
      "</span></div>";

    let html = '<div class="banner" style="border-color:#f0d9bb;background:#fffaf2">⏳ <div><b>보낸 요청 미회신</b> — 협력사·타 부서·고객사에 답변·자료·승인·조치를 요청했는데 아직 회신이 없는 건입니다. (상사 보고·자료 제출은 제외) 행을 누르면 <b>보낸 원문 → 요청 요약 → 독촉 문구</b>를 보고, 회신이 오면 하단에서 <b>회신 받음(추적 완료)</b>을 누르세요.</div></div>';
    html += '<div class="sec-title">⏳ 대기 중 <span class="hint">' + pend.length + "건 · 오래된 순</span></div>";
    html += pend.length ? '<div class="rows">' + pend.map(fuRowHtml).join("") + "</div>"
      : '<div class="empty">' + (q ? "검색어에 맞는 미회신 건이 없습니다." : "현재 회신을 기다리는 요청 메일이 없습니다.<br>(완료 보고·자료 제출 메일은 자동 제외)") + "</div>";
    if (done.length) {
      html += '<div class="sec-title" style="margin-top:12px">✅ 추적 완료 <span class="hint">' + done.length + "건 · 회신 받음으로 표시</span></div>";
      html += '<div class="rows">' + done.map(fuRowHtml).join("") + "</div>";
    }
    $("listWrap").innerHTML = html;
    $("dayChip").classList.remove("on");
  }
  function sortFu(list) {
    return list.slice().sort((a, b) => (Number(b.daysElapsed) || 0) - (Number(a.daysElapsed) || 0) || String(a.sentAt).localeCompare(String(b.sentAt)));
  }

  /* ⏳ 미회신 추적 — 상세 드로어 (보낸 원문 → 요청 요약 → 독촉 문구 → 상태) */
  function fuMailto(f) {
    const d = f.followUpDraft || {};
    const q = [];
    if (d.cc) q.push("cc=" + encodeURIComponent(d.cc));
    q.push("subject=" + encodeURIComponent(d.subject || ""));
    q.push("body=" + encodeURIComponent(d.body || ""));
    return "mailto:" + encodeURIComponent(d.to || f.recipientEmail || "") + "?" + q.join("&");
  }

          (f.attachName ? '<div class="att-list" style="margin-bottom:6px"><span class="att">📎 <span class="nm">' + esc(f.attachName) + "</span></span></div>" : "") +
          '<div class="body-text">' + esc(f.bodyText || "") + "</div></div>" +
        /* 2. 요청 요약 + 미회신 근거 */
        '<div class="dr-sec"><div class="sec-h">📝 요청 요약</div><p class="dr-summary">' + esc(f.summary || "") + "</p>" +
          (f.evidence ? '<div class="att-sum" style="margin-top:6px">🔎 미회신 확인 · ' + esc(f.evidence) + "</div>" : "") + "</div>" +
        /* 3. 독촉·확인 문구 */
        draft +
        /* 4. 메모 */
        '<div class="dr-sec"><div class="sec-h">🗒️ 내 메모</div>' +
          '<textarea class="memo" data-fu-memo="' + esc(f.id) + '" placeholder="연락한 사람·회신 예정일·전달 내용 (이 기기에만 저장)">' + esc(st.memo || "") + "</textarea></div>" +
      "</div>" +
      '<div class="dr-foot">' +
        '<div class="reply-row">' +
          '<button class="reply-btn ' + (done ? "on" : "") + '" data-fu-set="done" data-fu-id="' + esc(f.id) + '" data-reply="replied">✅ 회신 받음 (추적 완료)</button>' +
          '<button class="reply-btn ' + (!done ? "on" : "") + '" data-fu-set="waiting" data-fu-id="' + esc(f.id) + '" data-reply="needs_reply">⏳ 계속 대기</button>' +
        "</div>" +

  /* ---------------- 상세 드로어 ---------------- */
  function badgeRow(it) {
    const p = priorityOf(it), d = dueInfo(it), r = replyOf(it);
    const parts = [];
    parts.push('<span class="badge b-p' + p + '">' + (p === 1 ? "🔴 즉시 확인" : p === 2 ? "🟡 흐름 참고" : "⚪ 단순 공유") + "</span>");
    if (p === 1) {
      parts.push(it.isVip && it.vipLabel
        ? '<span class="badge b-vip">' + esc(it.vipLabel) + "</span>"
        : '<span class="badge b-to">1-' + (Number(it.vipRank) || 3) + "</span>");
    }
    if (isArchived(it)) parts.push('<span class="badge b-arch">이전 기록</span>');
    parts.push('<span class="badge ' + (it.recipientRole === "To" ? "b-to" : "b-cc") + '">' + (it.recipientRole === "To" ? "수신인(To)" : it.recipientRole === "CC" ? "참조(CC)" : "기타") + "</span>");
    if (it.mentionedUser) parts.push('<span class="badge b-vip">본문 언급</span>');
    if (d.text) parts.push('<span class="badge b-due ' + d.cls + '">' + esc(d.text) + "</span>");
    parts.push('<span class="badge ' + (r === "needs_reply" ? "b-reply" : r === "replied" ? "b-replied" : "b-noreply") + '">' + esc(REPLY_LABEL[r]) + "</span>");
    parts.push('<span class="badge b-st">' + esc(ST_LABEL[stateOf(it).status] || "대기") + "</span>");
    return parts.join("");
  }

  function drawerHtml(it) {
    const st = stateOf(it), rows = it.actionItems || [], thr = threadOf(it), r = replyOf(it);
    const checks = rows.map((txt, i) => '<li class="' + (st.checks[i] ? "on" : "") + '"><input type="checkbox" data-check="' + it.id + '" data-i="' + i + '"' +
      (st.checks[i] ? " checked" : "") + "><span>" + esc(txt) + "</span></li>").join("");
    const d = it.replyDraft;
    const draft = d ? '<div class="dr-sec"><div class="sec-h">✉️ 답장 메일 문구 제안 <span class="cnt">· ' + esc(d.to || "-") + "</span></div>" +
      '<div class="draft"><div class="draft-h"><div class="to">' + esc(d.subject || "") + "</div>" +
      '<button class="mini" data-copy="' + it.id + '">📋 복사</button>' +
      '<a class="mini" href="' + esc(mailtoHref(d)) + '" target="_blank" rel="noopener">메일로 열기</a></div>' +
      '<div class="draft-body">' + esc(d.body || "") + "</div></div></div>" : "";

    const atts = (it.attachments || []);
    const attHtml = atts.length
      ? '<div class="att-list">' + atts.map((a) => '<span class="att">📎 <span class="nm">' + esc(a.name) + '</span><span class="sz">' + esc(a.size || "") + "</span></span>").join("") + "</div>"
      : (it.attachmentsUnverified ? '<div class="att-none">첨부 여부·파일명은 웹메일 원본에서 확인 (대시보드 미수집)</div>' : '<div class="att-none">첨부파일 없음 (본문 인라인 자료)</div>');
    const attSum = it.attachmentSummary ? '<div class="att-sum">📎 ' + esc(it.attachmentSummary) + "</div>" : "";
    const attBlock = '<div class="sub-h">📎 첨부파일 <span class="cnt">· ' + atts.length + "건</span></div>" + attHtml + attSum;

    const threadHtml = thr.length > 1
      ? '<div class="dr-sec"><div class="sec-h">🕒 히스토리</div><details class="thread"' + (it.thread.length <= 4 ? " open" : "") + '><summary>이전 메일 ' + (thr.length - 1) + "건 타임라인 (총 " + thr.length + "건)</summary>" +
        '<ul class="thread-list">' + thr.slice().reverse().map((m) =>
          '<li><span class="th-date">' + esc(m.date) + '</span><span class="th-from">' + esc(m.from) + "</span>" +
          '<span class="th-gist">' + esc(m.gist) + "</span></li>").join("") + "</ul></details></div>"
      : "";

    const tbl = it.tableData;
    const tblHtml = (tbl && tbl.rows && tbl.rows.length)
      ? (tbl.note ? '<div class="tnote">' + esc(tbl.note) + "</div>" : "") +
        '<table class="dr-table"><thead><tr>' + (tbl.headers || []).map((h) => "<th>" + esc(h) + "</th>").join("") + "</tr></thead><tbody>" +
        tbl.rows.map((r) => '<tr' + ((String(r[0] || "").toLowerCase() === "total") ? ' class="total"' : "") + ">" +
          r.map((c) => '<td' + (/^[\d,]+$/.test(String(c || "")) ? ' class="num"' : "") + ">" + esc(c) + "</td>").join("") + "</tr>").join("") +
        "</tbody></table>"
      : "";
    const body = tblHtml + (it.bodyText ? '<div class="body-text">' + esc(it.bodyText) + "</div>"
      : (tblHtml ? "" : '<div class="att-none">본문은 대시보드에 저장하지 않았습니다. 아래 ‘웹메일 원본 열기’에서 확인하세요.</div>'));

    const imgs = it.images || [];
    const imgHtml = imgs.length
      ? '<div class="sub-h">🖼️ 본문 사진 <span class="cnt">· ' + imgs.length + "장</span></div>" +
        '<div class="img-grid' + (imgs.length === 1 ? " single" : "") + '">' +
        imgs.map((im, i) => '<button type="button" class="img-cell" data-zoom="' + esc(it.id) + '" data-i="' + i + '" aria-label="' + esc((im.name || "사진") + " 크게 보기") + '">' +
          '<img src="' + esc(im.dataUrl) + '" alt="' + esc(im.name || "메일 본문 사진") + '" loading="lazy">' +
          '<span class="zoom">🔍 크게</span></button>').join("") + "</div>" +
        '<div class="img-hint">사진을 누르면 원본 크기로 크게 볼 수 있습니다.</div>'
      : "";

    return '<div class="dr-head"><div style="flex:1;min-width:0">' +
        '<div class="badges">' + badgeRow(it) + "</div>" +
        "<h2>" + esc(it.title) + "</h2></div>" +
        '<button class="dr-close" id="drClose" aria-label="닫기">✕</button></div>' +
      '<div class="dr-body">' +
        /* 1. 메일 원문 — 본문 표 · 본문 텍스트 · 본문 사진 · 첨부파일 */
        '<div class="dr-sec"><div class="sec-h">📄 메일 원문</div>' +
          '<div class="dr-meta dr-meta-top"><span><b>' + esc(it.sender) + "</b> &lt;" + esc(it.senderEmail) + "&gt;</span>" +
          "<span>수신 " + esc(it.receivedAt) + "</span><span>마감 " + esc(it.deadline || "-") + "</span>" +
          (it.priorityReason ? "<span>판정 " + esc(it.priorityReason) + "</span>" : "") + "</div>" +
          body + imgHtml + attBlock + "</div>" +
        /* 2. 핵심 분석 */
        '<div class="dr-sec"><div class="sec-h">📝 핵심 분석</div><p class="dr-summary">' + esc(it.summary || "") + "</p>" +
          (it.repliedNote && !stateOf(it).reply ? '<div class="att-sum" style="margin-top:6px">↩️ ' + esc(it.repliedNote) + "</div>" : "") + "</div>" +
        /* 3. 할 일 */
        (rows.length ? '<div class="dr-sec"><div class="sec-h">✅ 할 일 <span class="cnt" data-cnt="' + it.id + '">· ' + doneCount(it) + "/" + rows.length + "</span></div><ul class=\"todo\">" + checks + "</ul></div>" : "") +
        /* 4. 히스토리 */
        threadHtml +
        /* 5. 답장 메일 문구 제안 */
        draft +
        '<div class="dr-sec"><div class="sec-h">🗒️ 내 메모</div>' +
          '<textarea class="memo" data-memo="' + it.id + '" placeholder="처리 내용·연락한 사람·특이사항 (이 기기에만 저장)">' + esc(st.memo || "") + "</textarea></div>" +
      "</div>" +
      '<div class="dr-foot">' +
        '<div class="reply-row">' +
          ["needs_reply", "replied", "no_reply_needed"].map((k) =>
            '<button class="reply-btn ' + (r === k ? "on" : "") + '" data-reply="' + k + '" data-reply-id="' + it.id + '">' + REPLY_LABEL[k] + "</button>").join("") +
        "</div>" +
        '<select class="status-sel" data-status="' + it.id + '" aria-label="진행상태">' +
          '<option value="todo"' + (st.status === "todo" ? " selected" : "") + ">대기</option>" +
          '<option value="doing"' + (st.status === "doing" ? " selected" : "") + ">진행중</option>" +
          '<option value="done"' + (st.status === "done" ? " selected" : "") + ">완료</option></select>" +
        '<button type="button" class="mini' + (calDate(it) ? " on" : "") + '" data-cal-tog="' + esc(it.id) + '">📅 ' + (calDate(it) ? "캘린더 등록됨" : "캘린더 등록") + "</button>" +
        '<label class="cal-date" title="등록 날짜 바꾸기">날짜 <input type="date" data-cal-date="' + esc(it.id) + '" value="' + esc(calDate(it) || calDefaultDate(it)) + '"></label>' +
        '<button type="button" class="mini" data-done-tog="' + esc(it.id) + '">' + (isDone(it) ? "↩ 완료 취소" : "✅ 확인") + "</button>" +
        '<a class="mini" href="' + esc(it.mailLink || "#") + '" target="_blank" rel="noopener">웹메일 원본</a>' +
        '<span class="sp">' + esc(it.id) + "</span></div>";
  }

  function mailtoHref(d) {
    const q = [];
    if (d.cc) q.push("cc=" + encodeURIComponent(d.cc));
    q.push("subject=" + encodeURIComponent(d.subject || ""));
    q.push("body=" + encodeURIComponent(d.body || ""));
    return "mailto:" + encodeURIComponent(d.to || "") + "?" + q.join("&");
  }

  function openDrawer(id) {
    const f = fupById(id);
    if (f) {
      view.openId = id;
      $("drawerContent").innerHTML = fuDrawerHtml(f);
      $("drawer").classList.add("on");
      $("drawer").setAttribute("aria-hidden", "false");
      $("backdrop").classList.add("on");
      document.body.classList.add("locked");
      return;
    }
    const it = byId(id); if (!it) return;
    view.openId = id;
    $("drawerContent").innerHTML = drawerHtml(it);
    $("drawer").classList.add("on");
    $("drawer").setAttribute("aria-hidden", "false");
    $("backdrop").classList.add("on");
    document.body.classList.add("locked");
  }
  function closeDrawer() {
    view.openId = null;
    $("drawerContent").innerHTML = "";
    $("drawer").classList.remove("on");
    $("drawer").setAttribute("aria-hidden", "true");
    $("backdrop").classList.remove("on");
    document.body.classList.remove("locked");
  }

  /* ---------------- 이벤트 ---------------- */
  $("gateForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const pin = $("pin").value.trim();
    if (!pin) { $("gateErr").textContent = "PIN을 입력해 주세요."; return; }
    unlock(pin, $("remember").checked);
  });
  $("refreshBtn").addEventListener("click", () => refresh(true));
  $("bellBtn").addEventListener("click", toggleBell);
  $("notifTestBtn").addEventListener("click", testNotification);
  /* 상단 알림 카드 버튼 */
  $("abClose").addEventListener("click", hideAlertBanner);
  $("abOk").addEventListener("click", hideAlertBanner);
  $("abShow").addEventListener("click", () => { const id = alertTargetId; hideAlertBanner(); if (id) openDrawer(id); });
  /* 사용자가 화면을 클릭하거나 키를 누르면 탭 제목 깜빡임을 원래 제목으로 복구 */
  document.addEventListener("pointerdown", () => { if (titleTimer) stopTitleFlash(); }, true);
  document.addEventListener("keydown", () => { if (titleTimer) stopTitleFlash(); }, true);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && titleTimer) stopTitleFlash(); });
  $("lightbox").addEventListener("click", (e) => { if (e.target.id !== "lbImg") closeLightbox(); });
  $("lbClose").addEventListener("click", closeLightbox);
  $("lockBtn").addEventListener("click", lock);
  $("q").addEventListener("input", (e) => { view.q = e.target.value; renderList(); });
  $("sort").addEventListener("change", (e) => { view.sort = e.target.value; renderList(); });
  $("replyChk").addEventListener("change", (e) => {
    view.replyOnly = e.target.checked;
    $("replyTog").classList.toggle("on", view.replyOnly);
    renderList();
  });
  $("doneChk").addEventListener("change", (e) => {
    view.showDone = e.target.checked;
    $("doneTog").classList.toggle("on", view.showDone);
    renderList();
  });

  $("seg").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    view.tab = b.dataset.tab;
    view.day = null;
    view.sender = "all";
    renderSeg(); renderCalendar(); renderList();
  });
  $("chipRow").addEventListener("click", (e) => {
    const b = e.target.closest("[data-sender]"); if (!b) return;
    view.sender = b.dataset.sender; renderChips(); renderList();
  });
  $("chipRow").addEventListener("change", (e) => {
    if (e.target.id === "groupChk") { view.group = e.target.checked; renderList(); }
  });

  $("calBar").addEventListener("click", () => {
    view.calOpen = !view.calOpen;
    try { localStorage.setItem(LS.cal, view.calOpen ? "1" : "0"); } catch (e) {}
    renderCalendar();
  });
  $("calPrev").addEventListener("click", () => { view.ym.m--; if (view.ym.m < 0) { view.ym.m = 11; view.ym.y--; } renderCalendar(); });
  $("calNext").addEventListener("click", () => { view.ym.m++; if (view.ym.m > 11) { view.ym.m = 0; view.ym.y++; } renderCalendar(); });
  $("calToday").addEventListener("click", () => { const n = new Date(); view.ym = { y: n.getFullYear(), m: n.getMonth() }; renderCalendar(); });
  $("calDays").addEventListener("click", (e) => {
    const c = e.target.closest("[data-day]"); if (!c) return;
    const key = c.dataset.day;
    view.day = (view.day === key) ? null : key;
    view.sender = "all";
    if (view.day && $("cusDate")) $("cusDate").value = view.day;
    renderSeg(); renderCalendar(); renderList();
    if (view.day) $("listWrap").scrollIntoView({ behavior: "smooth", block: "start" });
  });
  /* ＋ 직접 일정 추가 */
  if ($("cusDate")) $("cusDate").value = todayY();
  $("cusForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const ok = cusAdd($("cusDate").value, $("cusTitle").value, $("cusMemo").value);
    if (ok) { $("cusTitle").value = ""; $("cusMemo").value = ""; $("cusDate").value = view.day || todayY(); }
  });
  $("dayClear").addEventListener("click", () => { view.day = null; renderCalendar(); renderList(); });

  $("sideToday").addEventListener("click", (e) => {
    const s = e.target.closest("[data-open]"); if (s) openDrawer(s.dataset.open);
  });
  $("sideWeek").addEventListener("click", (e) => {
    const s = e.target.closest("[data-open]"); if (s) openDrawer(s.dataset.open);
  });

  $("listWrap").addEventListener("click", (e) => {
    const cd = e.target.closest("[data-cus-del]");
    if (cd) { e.preventDefault(); e.stopPropagation(); cusDel(cd.dataset.cusDel); return; }
    const ct = e.target.closest("[data-cal-tog]");
    if (ct) { e.preventDefault(); e.stopPropagation(); calToggle(ct.dataset.calTog); return; }
    const dt = e.target.closest("[data-done-tog]");
    if (dt) { e.preventDefault(); e.stopPropagation(); const it = byId(dt.dataset.doneTog); if (it) setDone(it.id, !isDone(it)); return; }
    const tg = e.target.closest("[data-reply-tog]");
    if (tg) {
      e.preventDefault(); e.stopPropagation();
      const id = tg.dataset.replyTog, it = byId(id); if (!it) return;
      const prev = replyOf(it);
      setReply(id, NEXT_REPLY[prev] || "replied", prev);
      return;
    }
    const r = e.target.closest("[data-open]"); if (!r) return;
    openDrawer(r.dataset.open);
  });
  $("listWrap").addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    if (e.target.closest("[data-reply-tog]") || e.target.closest("[data-cal-tog]") || e.target.closest("[data-done-tog]")) return;
    const r = e.target.closest("[data-open]"); if (!r) return;
    e.preventDefault(); openDrawer(r.dataset.open);
  });
  $("backdrop").addEventListener("click", closeDrawer);
  $("drawer").addEventListener("click", async (e) => {
    if (e.target.id === "drClose") { closeDrawer(); return; }

    const z = e.target.closest("[data-zoom]");
    if (z) {
      const it = byId(z.dataset.zoom), i = Number(z.dataset.i);
      const im = it && (it.images || [])[i];
      if (im) openLightbox(im.dataUrl, (it.title ? it.title + " · " : "") + (im.name || ""));
      return;
    }

    const rp = e.target.closest("[data-reply-id]");
    if (rp) {
      const id = rp.dataset.replyId, k = rp.dataset.reply;
      setReply(id, k, replyOf(byId(id)));
      return;
    }
    const dc = e.target.closest("[data-cal-tog]");
    if (dc) { calToggle(dc.dataset.calTog); return; }
    const dn = e.target.closest("[data-done-tog]");
    if (dn) { const it = byId(dn.dataset.doneTog); if (it) setDone(it.id, !isDone(it)); return; }
    const fs = e.target.closest("[data-fu-set]");
    if (fs) { fuSetStatus(fs.dataset.fuId, fs.dataset.fuSet); return; }
    const fc = e.target.closest("[data-fu-copy]");
    if (fc) {
      const f = fupById(fc.dataset.fuCopy); if (!f || !f.followUpDraft) return;
      const text = f.followUpDraft.body;
      try { await navigator.clipboard.writeText(text); }
      catch (err) {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e2) {}
        document.body.removeChild(ta);
      }
      fc.classList.add("on"); fc.textContent = "✓ 복사됨";
      setTimeout(() => { fc.classList.remove("on"); fc.textContent = "📋 복사"; }, 1800);
      toast("독촉/확인 문구를 복사했습니다");
      return;
    }
    const cp = e.target.closest("[data-copy]");
    if (cp) {
      const it = byId(cp.dataset.copy); if (!it || !it.replyDraft) return;
      const text = it.replyDraft.body;
      try { await navigator.clipboard.writeText(text); }
      catch (err) {
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.select();
        try { document.execCommand("copy"); } catch (e2) {}
        document.body.removeChild(ta);
      }
      cp.classList.add("on"); cp.textContent = "✓ 복사됨";
      setTimeout(() => { cp.classList.remove("on"); cp.textContent = "📋 복사"; }, 1800);
      toast("회신 초안을 복사했습니다");
    }
  });
  $("drawer").addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.check) {
      const st = itemState(t.dataset.check);
      st.checks[Number(t.dataset.i)] = t.checked; saveState();
      const li = t.closest("li"); if (li) li.classList.toggle("on", t.checked);
      const it = byId(t.dataset.check), cnt = t.closest(".dr-sec").querySelector("[data-cnt]");
      if (cnt && it) cnt.textContent = "· " + doneCount(it) + "/" + (it.actionItems || []).length;
      renderList();
      return;
    }
    if (t.dataset.status) {
      itemState(t.dataset.status).status = t.value; saveState();
      const it = byId(t.dataset.status);
      $("drawerContent").innerHTML = drawerHtml(it);
      renderKpi(); renderSeg(); renderCalendar(); renderList();
      return;
    }
    if (t.dataset.calDate) { calSetDate(t.dataset.calDate, t.value); return; }
  });
  $("drawer").addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.fuMemo) { fuState(t.dataset.fuMemo).memo = t.value; clearTimeout(t._h); t._h = setTimeout(saveState, 350); return; }
    if (t.dataset.memo) { itemState(t.dataset.memo).memo = t.value; clearTimeout(t._h); t._h = setTimeout(saveState, 350); }
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if ($("lightbox").classList.contains("on")) { closeLightbox(); return; }
    closeDrawer();
  });

  /* 마감 카운트다운 — 1분마다 배지만 갱신 */
  setInterval(() => { if (DATA && PIN) { renderList(); renderKpi(); } }, 60 * 1000);

  /* ---------------- 시작 ---------------- */
  (async function boot() {
    let saved = null;
    try { saved = localStorage.getItem(LS.pin); } catch (e) {}
    if (saved) {
      try {
        ENC = await fetchEnc();
        DATA = await decryptData(ENC, b64dec(saved));
        PIN = b64dec(saved);
        $("remember").checked = true;
        $("gate").hidden = true; $("app").hidden = false;
        renderAll(); scheduleAuto(); paintBell(); notifyNewP1();
        return;
      } catch (e) { localStorage.removeItem(LS.pin); }
    }
    try { ENC = await fetchEnc(); } catch (e) {}
    $("pin").focus();
  })();
})();
</script>
</body>
</html>
