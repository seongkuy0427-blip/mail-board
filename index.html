<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>업무 대시보드 · 천일정기화물 납입1팀</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#ffffff; --ink:#16202e; --ink-2:#4a5768; --ink-3:#8794a5;
    --line:#e3e8ef; --brand:#1f5fd0; --brand-weak:#eaf1fd;
    --red:#d93b3b; --red-weak:#fdeaea; --orange:#d97a12; --orange-weak:#fdf2e3;
    --green:#1a8a5a; --green-weak:#e8f6ef; --gray-weak:#eef1f6;
    --shadow:0 1px 2px rgba(16,32,64,.06), 0 8px 24px rgba(16,32,64,.05);
    --r:14px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); line-height:1.5;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  a{color:var(--brand); text-decoration:none}
  button{font-family:inherit}
  .wrap{max-width:1180px; margin:0 auto; padding:0 16px}

  /* ---------- 잠금 화면 ---------- */
  #gate{min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px}
  .gate-card{width:100%; max-width:380px; background:var(--card); border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); padding:30px 26px 24px; text-align:center}
  .gate-logo{width:52px;height:52px;border-radius:15px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 14px}
  .gate-card h1{font-size:19px; margin:0 0 6px; letter-spacing:-.3px}
  .gate-card p{margin:0 0 20px; color:var(--ink-3); font-size:13px}
  .pin-input{width:100%; padding:14px 12px; font-size:22px; letter-spacing:.4em; text-align:center;
    border:1.5px solid var(--line); border-radius:12px; outline:none; background:#fbfcfe; color:var(--ink)}
  .pin-input:focus{border-color:var(--brand); background:#fff}
  .gate-row{display:flex; align-items:center; gap:8px; margin:14px 0 4px; font-size:13px; color:var(--ink-2); text-align:left}
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line);
    background:#fff; color:var(--ink); padding:9px 14px; border-radius:10px; font-size:13px; cursor:pointer; white-space:nowrap}
  .btn:hover{background:#f8fafc}
  .btn-primary{background:var(--brand); border-color:var(--brand); color:#fff}
  .btn-primary:hover{background:#1a52b8}
  .btn-block{width:100%; padding:12px; font-size:14px; margin-top:16px}
  .err{color:var(--red); font-size:12.5px; min-height:18px; margin-top:10px}
  .gate-foot{margin-top:16px; font-size:11.5px; color:var(--ink-3); line-height:1.6}

  /* ---------- 헤더 ---------- */
  header{position:sticky; top:0; z-index:20; background:rgba(244,246,250,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line)}
  .hd{display:flex; align-items:center; gap:12px; padding:12px 0}
  .hd .mark{width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .hd h1{font-size:15.5px; margin:0; letter-spacing:-.2px}
  .hd .sub{font-size:11.5px; color:var(--ink-3); margin-top:1px}
  .hd-right{margin-left:auto; display:flex; align-items:center; gap:8px}
  .sync{font-size:11.5px; color:var(--ink-3); text-align:right; line-height:1.35}
  .sync b{color:var(--ink-2); font-weight:600}
  .icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px}
  .icon-btn:hover{background:#f8fafc}
  .spin{animation:sp .9s linear infinite; display:inline-block}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- KPI ---------- */
  .kpi{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:18px 0 4px}
  .kpi-card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; box-shadow:var(--shadow)}
  .kpi-card .lab{font-size:12px; color:var(--ink-3); display:flex; align-items:center; gap:6px}
  .kpi-card .val{font-size:26px; font-weight:700; letter-spacing:-.6px; margin-top:4px}
  .kpi-card .val small{font-size:12px; font-weight:500; color:var(--ink-3); margin-left:4px}
  .kpi-card.urgent{border-left:3px solid var(--red)}
  .kpi-card.progress{border-left:3px solid var(--brand)}
  .kpi-card.done{border-left:3px solid var(--green)}

  /* ---------- 툴바 ---------- */
  .toolbar{margin:16px 0 10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center}
  .search{position:relative; flex:1 1 260px; min-width:200px}
  .search input{width:100%; padding:10px 12px 10px 34px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:13.5px; outline:none}
  .search input:focus{border-color:var(--brand)}
  .search span{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-3); font-size:13px}
  select.sort{padding:9px 10px; border:1px solid var(--line); border-radius:10px; background:#fff; font-size:13px; color:var(--ink-2)}
  .tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
  .tab{padding:7px 12px; border-radius:999px; border:1px solid var(--line); background:#fff; font-size:12.5px; color:var(--ink-2); cursor:pointer}
  .tab.on{background:var(--brand); border-color:var(--brand); color:#fff}
  .tab .n{opacity:.65; margin-left:4px; font-size:11.5px}
  .filter-note{font-size:12px; color:var(--ink-3); margin:2px 2px 12px}

  /* ---------- 카드 ---------- */
  .list{display:flex; flex-direction:column; gap:12px; padding-bottom:60px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); overflow:hidden; border-left:4px solid var(--ink-3)}
  .card.urgent{border-left-color:var(--red)}
  .card.high{border-left-color:var(--orange)}
  .card.normal{border-left-color:#9aa7b8}
  .card.done{opacity:.72}
  .card-top{padding:14px 16px 0}
  .badges{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-bottom:8px}
  .badge{font-size:11px; padding:3px 8px; border-radius:999px; font-weight:600; letter-spacing:-.1px}
  .b-urgent{background:var(--red-weak); color:var(--red)}
  .b-high{background:var(--orange-weak); color:var(--orange)}
  .b-normal{background:var(--gray-weak); color:var(--ink-2)}
  .b-due{background:var(--brand-weak); color:var(--brand)}
  .b-cat{background:#eef1f6; color:var(--ink-2); font-weight:500}
  .b-status{background:#fff; border:1px solid var(--line); color:var(--ink-2); font-weight:500}
  .card h2{font-size:16px; margin:0 0 6px; letter-spacing:-.3px; line-height:1.35}
  .meta{font-size:12px; color:var(--ink-3); display:flex; flex-wrap:wrap; gap:4px 10px; margin-bottom:10px}
  .meta b{color:var(--ink-2); font-weight:500}
  .summary{font-size:13.5px; color:var(--ink-2); margin:0 0 12px; line-height:1.62}

  .sec{border-top:1px solid var(--line); padding:12px 16px}
  .sec-h{display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:700; color:var(--ink-2); margin-bottom:9px}
  .sec-h .cnt{font-weight:500; color:var(--ink-3); font-size:11.5px}
  .todo{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
  .todo li{display:flex; gap:9px; font-size:13.2px; color:var(--ink-2); align-items:flex-start; cursor:pointer}
  .todo input{margin-top:2px; width:15px; height:15px; accent-color:var(--brand); flex:none; cursor:pointer}
  .todo li.on span{text-decoration:line-through; color:var(--ink-3)}

  details.tbl{margin-top:2px}
  details.tbl summary{cursor:pointer; font-size:12.5px; color:var(--brand); font-weight:600; list-style:none; display:inline-flex; align-items:center; gap:6px}
  details.tbl summary::-webkit-details-marker{display:none}
  details.tbl summary::before{content:"▸"; transition:transform .15s}
  details.tbl[open] summary::before{transform:rotate(90deg)}
  .tbl-wrap{margin-top:10px; max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:10px}
  table{border-collapse:collapse; width:100%; font-size:12px; white-space:nowrap}
  thead th{position:sticky; top:0; background:#f7f9fc; text-align:left; font-weight:600; color:var(--ink-2); padding:7px 10px; border-bottom:1px solid var(--line); z-index:1}
  tbody td{padding:6px 10px; border-bottom:1px solid #f0f3f7; color:var(--ink-2)}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:nth-child(even){background:#fbfcfe}
  .tbl-note{font-size:11.5px; color:var(--ink-3); margin-top:7px; line-height:1.55}

  .att-list{display:flex; flex-wrap:wrap; gap:7px}
  .att{display:inline-flex; align-items:center; gap:6px; font-size:12.3px; color:var(--ink-2); background:#f7f9fc;
    border:1px solid var(--line); border-radius:9px; padding:6px 10px; max-width:100%}
  .att .nm{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .att .sz{color:var(--ink-3); font-size:11px; flex:none}
  .att-none{font-size:12.3px; color:var(--ink-3)}

  .body-text{font-size:12.8px; color:var(--ink-2); white-space:pre-wrap; background:#f8fafc; border:1px solid var(--line);
    border-radius:10px; padding:11px 12px; margin-top:9px; line-height:1.65; max-height:320px; overflow:auto}

  .draft{margin-top:9px; border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .draft-h{display:flex; align-items:center; gap:6px; padding:8px 10px; background:#f7f9fc; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .draft-h .to{font-size:11.5px; color:var(--ink-3); flex:1 1 160px; min-width:0; overflow:hidden; text-overflow:ellipsis}
  .draft-body{font-size:12.8px; color:var(--ink-2); white-space:pre-wrap; padding:11px 12px; line-height:1.65; max-height:300px; overflow:auto}
  .mini{font-size:11.5px; padding:5px 9px; border-radius:8px; border:1px solid var(--line); background:#fff; cursor:pointer; color:var(--ink-2)}
  .mini:hover{background:#f2f5fa}
  .mini.on{background:var(--green-weak); border-color:#bfe6d3; color:var(--green)}

  .memo-row{display:flex; gap:8px; align-items:flex-start; flex-wrap:wrap}
  .memo{flex:1 1 240px; min-height:38px; resize:vertical; font-size:12.8px; padding:9px 10px; border:1px solid var(--line); border-radius:10px; font-family:inherit; color:var(--ink-2); background:#fff; outline:none}
  .memo:focus{border-color:var(--brand)}
  .status-sel{padding:8px 10px; border:1px solid var(--line); border-radius:10px; font-size:12.5px; background:#fff; color:var(--ink-2)}
  .card-foot{display:flex; align-items:center; gap:8px; padding:10px 16px; background:#fbfcfe; border-top:1px solid var(--line); flex-wrap:wrap}
  .card-foot .sp{margin-left:auto; font-size:11.5px; color:var(--ink-3)}

  .empty{text-align:center; color:var(--ink-3); font-size:13.5px; padding:56px 16px; background:var(--card); border:1px dashed var(--line); border-radius:var(--r)}
  footer{text-align:center; color:var(--ink-3); font-size:11.5px; padding:18px 0 34px; line-height:1.7}
  .toast{position:fixed; left:50%; bottom:26px; transform:translate(-50%,20px); background:#16202e; color:#fff; font-size:13px;
    padding:10px 16px; border-radius:10px; opacity:0; pointer-events:none; transition:.22s; z-index:50; box-shadow:0 8px 24px rgba(0,0,0,.2)}
  .toast.on{opacity:1; transform:translate(-50%,0)}

  @media (max-width:760px){
    .kpi{grid-template-columns:repeat(2,1fr); gap:9px}
    .kpi-card{padding:11px 12px}
    .kpi-card .val{font-size:22px}
    .hd h1{font-size:14px}
    .hd .sub{display:none}
    .sync{display:none}
    .card h2{font-size:15px}
    .sec{padding:11px 13px}
    .card-top{padding:12px 13px 0}
    .card-foot{padding:10px 13px}
  }
</style>
</head>
<body>

<!-- ============ 잠금 화면 ============ -->
<div id="gate">
  <form class="gate-card" id="gateForm" autocomplete="off">
    <div class="gate-logo">📋</div>
    <h1>업무 대시보드</h1>
    <p>천일정기화물 납입1팀 · 김성규 과장</p>
    <input class="pin-input" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="••••" aria-label="PIN">
    <label class="gate-row"><input type="checkbox" id="remember"> 이 기기에서 로그인 유지</label>
    <button class="btn btn-primary btn-block" type="submit" id="unlockBtn">열기</button>
    <div class="err" id="gateErr"></div>
    <div class="gate-foot">
      데이터는 PIN으로 암호화되어 있습니다.<br>PIN을 모르면 내용을 볼 수 없습니다.
    </div>
  </form>
</div>

<!-- ============ 대시보드 ============ -->
<div id="app" hidden>
  <header>
    <div class="wrap hd">
      <div class="mark">📋</div>
      <div>
        <h1>업무 대시보드</h1>
        <div class="sub" id="who">천일정기화물 납입1팀</div>
      </div>
      <div class="hd-right">
        <div class="sync" id="sync">마지막 동기화<br><b>-</b></div>
        <button class="icon-btn" id="refreshBtn" title="새로고침" aria-label="새로고침">↻</button>
        <button class="icon-btn" id="lockBtn" title="잠금" aria-label="잠금">🔒</button>
      </div>
    </div>
  </header>

  <div class="wrap">
    <div class="kpi" id="kpi"></div>

    <div class="toolbar">
      <div class="search"><span>🔍</span><input id="q" type="search" placeholder="제목 · 발신자 · 품번 · 내용 검색"></div>
      <select class="sort" id="sort">
        <option value="urgency">긴급도 · 마감순</option>
        <option value="deadline">마감 임박순</option>
        <option value="recent">최신 수신순</option>
      </select>
    </div>

    <div class="tabs" id="catTabs"></div>
    <div class="tabs" id="stTabs"></div>
    <div class="filter-note" id="filterNote"></div>

    <div class="list" id="list"></div>
    <footer id="foot"></footer>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(() => {
  "use strict";

  const LS = {
    pin: "mb_pin_v1",
    state: "mb_state_v1",
  };
  const AUTO_REFRESH_MS = 5 * 60 * 1000;   // 5분
  const URG = { urgent: 0, high: 1, normal: 2 };
  const URG_LABEL = { urgent: "긴급", high: "높음", normal: "보통" };
  const ST_LABEL = { todo: "대기", doing: "진행중", done: "완료" };

  let ENC = null;        // data.enc.json 원본
  let DATA = null;       // 복호화된 데이터
  let PIN = null;
  let STORE = loadState();
  let view = { q: "", cat: "all", st: "all", sort: "urgency" };

  const $ = (id) => document.getElementById(id);

  /* ---------------- 저장소 ---------------- */
  function loadState() {
    try { return JSON.parse(localStorage.getItem(LS.state) || "{}") || {}; } catch (e) { return {}; }
  }
  function saveState() {
    try { localStorage.setItem(LS.state, JSON.stringify(STORE)); } catch (e) {}
  }
  function itemState(id) {
    if (!STORE[id]) STORE[id] = { status: "todo", memo: "", checks: [] };
    if (!Array.isArray(STORE[id].checks)) STORE[id].checks = [];
    return STORE[id];
  }
  function b64enc(s) { return btoa(unescape(encodeURIComponent(s))); }
  function b64dec(s) { return decodeURIComponent(escape(atob(s))); }

  function toast(msg) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(t._h);
    t._h = setTimeout(() => t.classList.remove("on"), 1900);
  }

  /* ---------------- 암호 ---------------- */
  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function deriveKey(pin, salt, iterations) {
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt, iterations, hash: "SHA-256" },
      km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
    );
  }
  async function decryptData(enc, pin) {
    if (!window.crypto || !crypto.subtle) throw new Error("이 브라우저에서는 암호화 기능을 쓸 수 없습니다. https 주소로 열어 주세요.");
    const key = await deriveKey(pin, b64ToBytes(enc.salt), enc.iterations || 100000);
    const plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64ToBytes(enc.iv) }, key, b64ToBytes(enc.ciphertext)
    );
    return JSON.parse(new TextDecoder().decode(plain));
  }

  async function fetchEnc() {
    const res = await fetch("./data.enc.json?t=" + Date.now(), { cache: "no-store" });
    if (!res.ok) throw new Error("데이터를 불러오지 못했습니다 (HTTP " + res.status + ")");
    return res.json();
  }

  /* ---------------- 잠금 해제 ---------------- */
  async function unlock(pin, remember) {
    const btn = $("unlockBtn");
    $("gateErr").textContent = "";
    btn.disabled = true; btn.textContent = "확인 중…";
    try {
      if (!ENC) ENC = await fetchEnc();
      DATA = await decryptData(ENC, pin);
      PIN = pin;
      if (remember) localStorage.setItem(LS.pin, b64enc(pin));
      else localStorage.removeItem(LS.pin);
      $("gate").hidden = true;
      $("app").hidden = false;
      renderAll();
      scheduleAuto();
    } catch (e) {
      const msg = (e && e.name === "OperationError")
        ? "PIN이 맞지 않습니다."
        : (e && e.message ? e.message : "열지 못했습니다.");
      $("gateErr").textContent = msg;
      if (e && e.name === "OperationError" && PIN !== null) {
        localStorage.removeItem(LS.pin);
        PIN = null;
      }
    } finally {
      btn.disabled = false; btn.textContent = "열기";
    }
  }

  function lock() {
    localStorage.removeItem(LS.pin);
    DATA = null; PIN = null;
    $("app").hidden = true; $("gate").hidden = false;
    $("pin").value = "";
    $("gateErr").textContent = "";
  }

  /* ---------------- 동기화 ---------------- */
  function stamp(d) {
    const t = d || new Date();
    const p = (n) => String(n).padStart(2, "0");
    return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
  }

  async function refresh(manual) {
    const btn = $("refreshBtn");
    btn.classList.add("spin");
    try {
      const enc = await fetchEnc();
      const fresh = await decryptData(enc, PIN);
      ENC = enc; DATA = fresh;
      $("sync").innerHTML = "마지막 동기화<br><b>" + stamp(new Date()) + "</b>";
      renderAll();
      if (manual) toast("최신 데이터로 갱신했습니다");
    } catch (e) {
      if (manual) toast("갱신 실패 — PIN을 다시 확인해 주세요");
      if (e && e.name === "OperationError") lock();
    } finally {
      btn.classList.remove("spin");
    }
  }

  let autoTimer = null;
  function scheduleAuto() {
    clearInterval(autoTimer);
    autoTimer = setInterval(() => { if (DATA && PIN) refresh(false); }, AUTO_REFRESH_MS);
  }

  /* ---------------- 데이터 가공 ---------------- */
  function stateOf(it) { return itemState(it.id); }

  function allActions(it) {
    return (it.actionItems || []).map((_, i) => i);
  }
  function doneCount(it) {
    const st = stateOf(it);
    return allActions(it).filter((i) => st.checks[i]).length;
  }
  function isDone(it) { return stateOf(it).status === "done"; }

  function deadlineMs(it) {
    if (!it.deadlineAt) return Number.MAX_SAFE_INTEGER;
    const t = Date.parse(it.deadlineAt);
    return isNaN(t) ? Number.MAX_SAFE_INTEGER : t;
  }
  function isTodayDue(it) {
    if (!it.deadlineAt) return false;
    const d = new Date(deadlineMs(it));
    const n = new Date();
    return d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
  }

  function searchBlob(it) {
    if (it._blob) return it._blob;
    const parts = [it.title, it.sender, it.senderEmail, it.category, it.summary, it.bodyText,
      it.deadline, (it.actionItems || []).join(" ")];
    (it.attachments || []).forEach((a) => parts.push(a.name));
    if (it.replyDraft) parts.push(it.replyDraft.subject + " " + it.replyDraft.body);
    it._blob = parts.join(" ").toLowerCase();
    return it._blob;
  }

  function filtered() {
    const q = view.q.trim().toLowerCase();
    let list = (DATA.items || []).filter((it) => {
      if (view.cat !== "all" && it.category !== view.cat) return false;
      if (view.st === "urgent" && !(it.urgency === "urgent" || (isTodayDue(it) && !isDone(it)))) return false;
      if (view.st === "today" && !isTodayDue(it)) return false;
      if (view.st === "doing" && stateOf(it).status !== "doing") return false;
      if (view.st === "todo" && stateOf(it).status !== "todo") return false;
      if (view.st === "done" && !isDone(it)) return false;
      if (q && !searchBlob(it).includes(q)) return false;
      return true;
    });
    list.sort((a, b) => {
      if (view.sort === "recent") return (b.receivedAt || "").localeCompare(a.receivedAt || "");
      if (view.sort === "deadline") return deadlineMs(a) - deadlineMs(b);
      const u = (URG[a.urgency] ?? 9) - (URG[b.urgency] ?? 9);
      if (u !== 0) return u;
      return deadlineMs(a) - deadlineMs(b);
    });
    return list;
  }

  /* ---------------- 렌더 ---------------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function renderAll() {
    $("who").textContent = (DATA.owner || DATA.account || "") + (DATA.source ? " · " + DATA.source : "");
    renderKpi();
    renderTabs();
    renderList();
    $("foot").innerHTML = "데이터 갱신 " + esc(DATA.updatedAt || "-") +
      " · 5분마다 자동 새로고침 · PIN으로 암호화 저장(AES-256-GCM)" +
      "<br>진행상태와 메모는 이 기기 브라우저에만 저장됩니다.";
    if (!$("sync").dataset.set) {
      $("sync").innerHTML = "마지막 동기화<br><b>" + stamp(new Date()) + "</b>";
      $("sync").dataset.set = "1";
    }
  }

  function renderKpi() {
    const items = DATA.items || [];
    const total = items.length;
    const urgent = items.filter((it) => it.urgency === "urgent" || (isTodayDue(it) && !isDone(it))).length;
    const doing = items.filter((it) => stateOf(it).status === "doing").length;
    const done = items.filter(isDone).length;
    const openToday = items.filter((it) => isTodayDue(it) && !isDone(it)).length;
    $("kpi").innerHTML = `
      <div class="kpi-card"><div class="lab">전체 업무</div><div class="val">${total}<small>건</small></div></div>
      <div class="kpi-card urgent"><div class="lab">긴급 · 오늘 마감</div><div class="val">${urgent}<small>건</small></div>
        <div class="lab" style="margin-top:2px">오늘 마감 ${openToday}건</div></div>
      <div class="kpi-card progress"><div class="lab">진행 중</div><div class="val">${doing}<small>건</small></div></div>
      <div class="kpi-card done"><div class="lab">완료</div><div class="val">${done}<small>건</small></div></div>`;
  }

  function renderTabs() {
    const items = DATA.items || [];
    const cats = ["all", ...Array.from(new Set(items.map((i) => i.category).filter(Boolean)))];
    $("catTabs").innerHTML = cats.map((c) => {
      const n = c === "all" ? items.length : items.filter((i) => i.category === c).length;
      const label = c === "all" ? "전체" : c;
      return `<button class="tab ${view.cat === c ? "on" : ""}" data-cat="${esc(c)}">${esc(label)}<span class="n">${n}</span></button>`;
    }).join("");

    const sts = [
      ["all", "모두"],
      ["urgent", "긴급"],
      ["today", "오늘 마감"],
      ["todo", "대기"],
      ["doing", "진행중"],
      ["done", "완료"],
    ];
    $("stTabs").innerHTML = sts.map(([k, label]) => {
      let n = 0;
      if (k === "all") n = items.length;
      else if (k === "urgent") n = items.filter((i) => i.urgency === "urgent" || (isTodayDue(i) && !isDone(i))).length;
      else if (k === "today") n = items.filter(isTodayDue).length;
      else n = items.filter((i) => stateOf(i).status === k).length;
      return `<button class="tab ${view.st === k ? "on" : ""}" data-st="${k}">${label}<span class="n">${n}</span></button>`;
    }).join("");
  }

  function attachHtml(it) {
    const list = it.attachments || [];
    if (!list.length) return `<div class="att-none">첨부파일 없음 (본문 인라인 자료)</div>`;
    return `<div class="att-list">` + list.map((a) =>
      `<span class="att">📎 <span class="nm">${esc(a.name)}</span><span class="sz">${esc(a.size || "")}</span></span>`
    ).join("") + `</div>`;
  }

  function mailtoHref(d) {
    const q = [];
    if (d.cc) q.push("cc=" + encodeURIComponent(d.cc));
    q.push("subject=" + encodeURIComponent(d.subject || ""));
    q.push("body=" + encodeURIComponent(d.body || ""));
    return "mailto:" + encodeURIComponent(d.to || "") + "?" + q.join("&");
  }

  function cardHtml(it) {
    const st = stateOf(it);
    const done = st.status === "done";
    const rows = it.actionItems || [];
    const checks = rows.map((txt, i) => {
      const on = !!st.checks[i];
      return `<li class="${on ? "on" : ""}"><input type="checkbox" data-check="${it.id}" data-i="${i}" ${on ? "checked" : ""}><span>${esc(txt)}</span></li>`;
    }).join("");

    const d = it.replyDraft;
    const draft = d ? `
      <div class="sec">
        <div class="sec-h">✉️ 회신 초안 <span class="cnt">· 받는사람 ${esc(d.to || "-")}</span></div>
        <div class="draft">
          <div class="draft-h">
            <div class="to">${esc(d.subject || "")}</div>
            <button class="mini" data-copy="${it.id}">📋 복사</button>
            <a class="mini" href="${esc(mailtoHref(d))}" target="_blank" rel="noopener">메일로 열기</a>
          </div>
          <div class="draft-body">${esc(d.body || "")}</div>
        </div>
      </div>` : "";

    return `
      <article class="card ${esc(it.urgency)}${done ? " done" : ""}" data-card="${it.id}">
        <div class="card-top">
          <div class="badges">
            <span class="badge b-${esc(it.urgency)}">${esc(URG_LABEL[it.urgency] || it.urgency)}</span>
            ${it.deadline ? `<span class="badge b-due">⏰ ${esc(it.deadline)}</span>` : ""}
            ${it.category ? `<span class="badge b-cat">${esc(it.category)}</span>` : ""}
            <span class="badge b-status">${esc(ST_LABEL[st.status] || "대기")}</span>
          </div>
          <h2>${esc(it.title)}</h2>
          <div class="meta">
            <span><b>${esc(it.sender)}</b> &lt;${esc(it.senderEmail)}&gt;</span>
            <span>수신 ${esc(it.receivedAt)}</span>
            <span>체크 ${doneCount(it)}/${rows.length}</span>
          </div>
          <p class="summary">${esc(it.summary || "")}</p>
        </div>

        ${rows.length ? `<div class="sec">
          <div class="sec-h">✅ 할 일 <span class="cnt">· ${doneCount(it)}/${rows.length}</span></div>
          <ul class="todo">${checks}</ul>
        </div>` : ""}

        <div class="sec">
          <div class="sec-h">📎 첨부파일 <span class="cnt">· ${(it.attachments || []).length}건</span></div>
          ${attachHtml(it)}
        </div>

        <div class="sec">
          <details class="tbl">
            <summary>메일 원문 보기</summary>
            <div class="body-text">${esc(it.bodyText || "")}</div>
          </details>
        </div>

        ${draft}

        <div class="sec">
          <div class="sec-h">🗒️ 내 진행상태 · 메모</div>
          <div class="memo-row">
            <select class="status-sel" data-status="${it.id}">
              <option value="todo" ${st.status === "todo" ? "selected" : ""}>대기</option>
              <option value="doing" ${st.status === "doing" ? "selected" : ""}>진행중</option>
              <option value="done" ${st.status === "done" ? "selected" : ""}>완료</option>
            </select>
            <textarea class="memo" data-memo="${it.id}" placeholder="처리 내용·연락한 사람·특이사항을 적어두세요 (이 기기에만 저장)">${esc(st.memo || "")}</textarea>
          </div>
        </div>

        <div class="card-foot">
          <a class="mini" href="${esc(it.mailLink || "#")}" target="_blank" rel="noopener">웹메일 원본 열기</a>
          <span class="sp">${esc(it.id)}</span>
        </div>
      </article>`;
  }

  function renderList() {
    const list = filtered();
    const note = `표시 ${list.length}건 / 전체 ${(DATA.items || []).length}건`;
    $("filterNote").textContent = view.q ? note + ` · 검색어 "${view.q}"` : note;
    if (!list.length) {
      $("list").innerHTML = `<div class="empty">조건에 맞는 업무가 없습니다.</div>`;
      return;
    }
    $("list").innerHTML = list.map(cardHtml).join("");
  }

  /* ---------------- 이벤트 ---------------- */
  $("gateForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const pin = $("pin").value.trim();
    if (!pin) { $("gateErr").textContent = "PIN을 입력해 주세요."; return; }
    unlock(pin, $("remember").checked);
  });

  $("refreshBtn").addEventListener("click", () => refresh(true));
  $("lockBtn").addEventListener("click", lock);

  $("q").addEventListener("input", (e) => { view.q = e.target.value; renderList(); });

  $("sort").addEventListener("change", (e) => { view.sort = e.target.value; renderList(); });

  $("catTabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-cat]");
    if (!b) return;
    view.cat = b.dataset.cat;
    renderTabs(); renderList();
  });
  $("stTabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-st]");
    if (!b) return;
    view.st = b.dataset.st;
    renderTabs(); renderList();
  });

  $("list").addEventListener("change", (e) => {
    const t = e.target;
    if (t.dataset.check) {
      const st = itemState(t.dataset.check);
      st.checks[Number(t.dataset.i)] = t.checked;
      saveState();
      const card = t.closest(".card");
      if (card) {
        const on = t.closest("li");
        if (on) on.classList.toggle("on", t.checked);
        const h = card.querySelector(".sec-h .cnt");
        const it = (DATA.items || []).find((x) => x.id === t.dataset.check);
        if (h && it) h.textContent = "· " + doneCount(it) + "/" + (it.actionItems || []).length;
      }
      return;
    }
    if (t.dataset.status) {
      itemState(t.dataset.status).status = t.value;
      saveState();
      renderKpi(); renderTabs(); renderList();
    }
  });

  $("list").addEventListener("input", (e) => {
    const t = e.target;
    if (t.dataset.memo) {
      itemState(t.dataset.memo).memo = t.value;
      clearTimeout(t._h);
      t._h = setTimeout(saveState, 350);
    }
  });

  $("list").addEventListener("click", async (e) => {
    const b = e.target.closest("[data-copy]");
    if (!b) return;
    const it = (DATA.items || []).find((x) => x.id === b.dataset.copy);
    if (!it || !it.replyDraft) return;
    const text = it.replyDraft.body;
    try {
      await navigator.clipboard.writeText(text);
    } catch (err) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); } catch (e2) {}
      document.body.removeChild(ta);
    }
    b.classList.add("on"); b.textContent = "✓ 복사됨";
    setTimeout(() => { b.classList.remove("on"); b.textContent = "📋 복사"; }, 1800);
    toast("회신 초안을 복사했습니다");
  });

  /* ---------------- 시작 ---------------- */
  (async function boot() {
    // 저장된 PIN 이 있으면 자동 로그인
    let saved = null;
    try { saved = localStorage.getItem(LS.pin); } catch (e) {}
    if (saved) {
      try {
        ENC = await fetchEnc();
        DATA = await decryptData(ENC, b64dec(saved));
        PIN = b64dec(saved);
        $("remember").checked = true;
        $("gate").hidden = true;
        $("app").hidden = false;
        renderAll();
        scheduleAuto();
        return;
      } catch (e) {
        localStorage.removeItem(LS.pin);
      }
    }
    try { ENC = await fetchEnc(); } catch (e) {}
    $("pin").focus();
  })();
})();
</script>
</body>
</html>
